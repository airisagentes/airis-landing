<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Reservá tu mesa — Flores en Fuego</title>
<meta name="description" content="Reservá tu mesa en Flores en Fuego. Elegí el salón, la fecha y el horario que prefieras.">

<!-- Open Graph / WhatsApp / Facebook -->
<meta property="og:type" content="website">
<meta property="og:title" content="Reservá tu mesa — Flores en Fuego">
<meta property="og:description" content="Elegí el salón, la fecha y el horario que prefieras. Reserva en simples pasos.">
<meta property="og:image" content="https://menuflores.com/bannerfuego.webp">
<meta property="og:url" content="https://www.airisworld.com/floresenfuego/">
<meta property="og:locale" content="es_AR">

<!-- Twitter Card (algunos clientes de mensajería también lo usan) -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Reservá tu mesa — Flores en Fuego">
<meta name="twitter:description" content="Elegí el salón, la fecha y el horario que prefieras.">
<meta name="twitter:image" content="https://menuflores.com/bannerfuego.webp">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>

/* ============================================================
   PROTOTIPO — widget propio (no usa el widget nativo de GHL).
   Este es el patrón pensado para clientes SIN calendario nativo
   configurado todavía. Consulta disponibilidad real vía webhooks
   de n8n en vez de embeber la interfaz de GHL.

   Mientras CONFIG.MOCK_MODE = true, los horarios son de prueba
   y "crear reserva" no escribe nada real — así se puede revisar
   el diseño y el flujo sin depender de que los webhooks ya existan.
   Cuando Lucas tenga los dos webhooks (ver especificación aparte),
   solo hay que completar las URLs de abajo y poner MOCK_MODE en false.
   ============================================================ */

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --azul:#5170FF;
  --navy:#0A0F2E;
  --violeta:#C9B28A;
  --coral:#EB9292;
  --paper:#F4F4F8;
  --blanco:#FFFFFF;
  --card-bg:#FFFFFF;
  --texto-oscuro:#0A0F2E;
  --texto-medio:#3a3f5c;
  --airis-blue:#5170FF;
  --font-display:'Bricolage Grotesque',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
  --r:16px;
  --r-lg:24px;
}
body{opacity:0;transition:opacity .25s ease}
body.marca-lista{opacity:1}
html{scroll-behavior:smooth}
body{
  background:var(--paper);
  color:var(--texto-oscuro);
  font-family:var(--font-display);
  min-height:100svh;
  -webkit-font-smoothing:antialiased;
  padding:104px 16px 80px;
}

.mock-banner{
  max-width:640px;margin:0 auto 20px;
  background:rgba(235,146,146,0.12);border:1px solid rgba(235,146,146,0.35);
  color:#b23b3b;font-family:var(--font-mono);font-size:11px;font-weight:600;
  padding:10px 16px;border-radius:12px;text-align:center;letter-spacing:0.02em;
}
.mock-banner.hidden{display:none}

.logo-badge{
  position:fixed;top:20px;left:20px;z-index:50;
  width:68px;height:68px;border-radius:18px;
  background:var(--azul);
  display:flex;align-items:center;justify-content:center;
  font-size:34px;
  box-shadow:0 8px 20px rgba(55,67,46,0.22);
}
.logo-badge img{width:60%;height:60%;object-fit:contain}

.top{max-width:640px;margin:0 auto 20px;text-align:center}
.top-eyebrow{font-weight:800;font-size:16px;letter-spacing:-0.2px;color:var(--texto-medio);margin-bottom:6px}
.top-title{font-weight:800;font-size:clamp(26px,7vw,34px);letter-spacing:-1px;color:var(--navy);margin-bottom:8px}
.top-sub{font-size:14px;color:var(--texto-medio);line-height:1.5;max-width:420px;margin:0 auto 28px}

.progress-wrap{max-width:640px;margin:0 auto 28px}
.progress-bar{display:flex;gap:6px;margin-bottom:10px}
.progress-seg{flex:1;height:4px;border-radius:100px;background:rgba(81,112,255,0.15);overflow:hidden}
.progress-seg-fill{height:100%;width:0%;background:var(--azul);border-radius:100px}
.progress-seg.done .progress-seg-fill,.progress-seg.active .progress-seg-fill{width:100%}
.progress-label{font-family:var(--font-mono);font-size:11px;color:var(--azul);letter-spacing:0.08em;text-transform:uppercase;display:flex;justify-content:space-between}
.progress-label span:last-child{color:var(--texto-medio)}

.widget{
  max-width:640px;margin:0 auto;
  background:var(--card-bg);
  border:1.5px solid rgba(81,112,255,0.15);
  border-radius:var(--r-lg);
  padding:28px 22px;
  box-shadow:0 12px 40px rgba(10,15,46,0.06);
}
.step{display:none;animation:fadeIn .4s ease}
.step.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

.step-title{font-weight:800;font-size:22px;letter-spacing:-0.7px;color:var(--navy);margin-bottom:6px}
.step-hint{font-size:13.5px;color:var(--texto-medio);line-height:1.5;margin-bottom:24px}

.salon-grid{display:grid;grid-template-columns:1fr;gap:10px}
.salon-card{
  display:flex;align-items:center;gap:14px;
  border:1.5px solid rgba(81,112,255,0.15);
  border-radius:var(--r);padding:14px 16px;
  cursor:pointer;transition:border-color .2s,background .2s;
  background:var(--paper);
}
.salon-card:hover{border-color:rgba(81,112,255,0.4)}
.salon-card.selected{border-color:var(--azul);background:rgba(81,112,255,0.06)}
.salon-icon{
  width:44px;height:44px;border-radius:12px;flex-shrink:0;
  background:rgba(81,112,255,0.12);
  display:flex;align-items:center;justify-content:center;font-size:20px;
}
.salon-info h4{font-size:15px;font-weight:700;color:var(--navy);margin-bottom:2px}
.salon-info p{font-size:12.5px;color:var(--texto-medio)}
.salon-check{
  margin-left:auto;width:20px;height:20px;border-radius:50%;
  border:1.5px solid rgba(81,112,255,0.3);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.salon-card.selected .salon-check{background:var(--azul);border-color:var(--azul)}
.salon-card.selected .salon-check::after{content:'✓';color:var(--blanco);font-size:12px;font-weight:700}

.personas-box{display:flex;align-items:center;justify-content:center;gap:28px;padding:36px 0 24px}
.stepper-btn{
  width:52px;height:52px;border-radius:50%;
  border:1.5px solid rgba(81,112,255,0.25);background:var(--paper);
  font-size:22px;font-weight:700;color:var(--azul);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .2s,border-color .2s;
}
.stepper-btn:hover{background:rgba(81,112,255,0.1);border-color:var(--azul)}
.stepper-btn:disabled{opacity:0.35;cursor:not-allowed}
.personas-num{font-size:40px;font-weight:800;color:var(--navy);min-width:64px;text-align:center;letter-spacing:-2px}
.personas-quick{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.quick-chip{
  font-family:var(--font-mono);font-size:12.5px;font-weight:500;
  border:1.5px solid rgba(81,112,255,0.2);border-radius:100px;
  padding:7px 16px;cursor:pointer;color:var(--texto-medio);background:var(--card-bg);
  transition:border-color .2s,color .2s;
}
.quick-chip:hover,.quick-chip.selected{border-color:var(--azul);color:var(--azul);background:rgba(81,112,255,0.06)}

.date-scroll{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:none}
.date-scroll::-webkit-scrollbar{display:none}
.date-scroll-wrap{position:relative;display:flex;align-items:center;gap:4px}
.date-scroll-wrap .date-scroll{flex:1;min-width:0}
.date-arrow{
  flex-shrink:0;width:30px;height:30px;border-radius:50%;border:1.5px solid rgba(81,112,255,0.25);
  background:var(--card-bg);color:var(--azul);font-size:18px;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:opacity 0.15s;
}
.date-arrow:hover{border-color:var(--azul)}
.date-arrow:disabled{opacity:0.25;cursor:default;pointer-events:none}
.date-chip{
  flex-shrink:0;min-width:62px;
  border:1.5px solid rgba(81,112,255,0.18);border-radius:14px;
  padding:10px 6px;text-align:center;cursor:pointer;background:var(--paper);
  transition:border-color .2s,background .2s;
}
.date-chip:hover{border-color:rgba(81,112,255,0.45)}
.date-chip.selected{border-color:var(--azul);background:var(--azul);color:var(--blanco)}
.date-chip.closed{opacity:0.35;cursor:not-allowed;pointer-events:none;background:var(--paper)}
.date-dow{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:0.05em;opacity:0.7}
.date-num{font-size:19px;font-weight:800;margin:3px 0}
.date-mon{font-family:var(--font-mono);font-size:9.5px;text-transform:uppercase;opacity:0.7}

.time-groups{margin-top:18px;min-height:52px}
.time-groups .time-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:0;margin-bottom:14px;min-height:0}
.time-groups .time-grid:last-child{margin-bottom:0}
.time-franja-label{font-family:var(--font-mono);font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--texto-medio);margin:14px 0 8px}
.time-franja-label:first-child{margin-top:0}
.time-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px;min-height:52px}
.time-slot{
  border:1.5px solid rgba(81,112,255,0.18);border-radius:12px;
  padding:11px 6px;text-align:center;font-size:13.5px;font-weight:600;
  color:var(--navy);cursor:pointer;background:var(--paper);
  transition:border-color .2s,background .2s,color .2s;
}
.time-slot:hover{border-color:rgba(81,112,255,0.45)}
.time-slot.selected{border-color:var(--azul);background:var(--azul);color:var(--blanco)}
.time-loading,.time-empty{
  grid-column:1/-1;text-align:center;font-family:var(--font-mono);
  font-size:12px;color:var(--texto-medio);padding:16px 0;
}
.section-mini-label{font-family:var(--font-mono);font-size:10.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--azul);margin:20px 0 4px;display:block}

.salon-resumen-row{
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px 14px;
  padding:10px 14px;margin-bottom:6px;
  background:var(--paper);border:1px solid rgba(81,112,255,0.15);border-radius:12px;
}
.salon-resumen-row span:first-child{font-size:13px;color:var(--texto-medio);font-weight:600}
.cambiar-salon-link{
  font-family:var(--font-display);font-weight:700;font-size:13px;color:var(--azul);
  text-decoration:underline;text-underline-offset:3px;white-space:nowrap;
  padding:4px 2px;/* área de toque más cómoda en mobile sin romper el layout */
}
.cambiar-salon-link:hover{opacity:0.75}

.form-field{margin-bottom:18px}
.form-field label{display:block;font-size:12.5px;font-weight:700;color:var(--navy);margin-bottom:7px;letter-spacing:0.01em}
.form-field input,.form-field select{
  width:100%;border:1.5px solid rgba(81,112,255,0.2);border-radius:12px;
  padding:13px 14px;font-family:var(--font-display);font-size:15px;color:var(--texto-oscuro);
  background:var(--paper);outline:none;transition:border-color .2s;
}
.form-field input:focus,.form-field select:focus{border-color:var(--azul)}
.tel-row{display:flex;gap:8px}
.tel-row select{flex:0 0 118px}
.tel-row input{flex:1}
.field-error{font-size:12px;color:var(--coral);margin-top:6px;display:none;font-weight:600}
.field-error.show{display:block}

.summary-card{background:#1A1F14;border-radius:var(--r);padding:20px;margin-bottom:22px}
.summary-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid rgba(255,255,255,0.08)}
.summary-row:last-child{border-bottom:none}
.summary-row-label{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:rgba(255,255,255,0.5)}
.summary-row-val{font-size:14px;font-weight:700;color:var(--blanco);text-align:right}

.success-box{text-align:center;padding:20px 0 4px}
.success-icon{
  width:64px;height:64px;border-radius:50%;background:rgba(81,112,255,0.12);
  display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:30px;color:var(--azul);
}

.nav-row{display:flex;gap:10px;margin-top:26px}
.btn{
  font-family:var(--font-display);font-weight:700;font-size:14.5px;
  padding:14px 22px;border-radius:100px;border:none;cursor:pointer;
  text-decoration:none;transition:transform .2s,opacity .2s;text-align:center;
}
.btn:disabled{opacity:0.4;cursor:not-allowed}
.btn-back{background:var(--paper);color:var(--navy);border:1.5px solid rgba(81,112,255,0.18);flex:0 0 auto}
.btn-next{background:var(--azul);color:var(--blanco);flex:1}
.btn-next:not(:disabled):hover{transform:translateY(-2px);opacity:0.92}

@media(min-width:600px){
  .salon-grid{grid-template-columns:1fr 1fr}
  .widget{padding:36px 40px}
}

.airis-footer{
  max-width:640px;margin:28px auto 0;
  display:flex;flex-direction:column;align-items:center;gap:6px;
}
.airis-footer-row{display:flex;align-items:baseline;justify-content:center;gap:6px}
.airis-footer-label{font-size:11px;color:var(--texto-medio);font-family:var(--font-mono);letter-spacing:0.04em}
.airis-footer-logo{font-weight:800;font-size:14px;letter-spacing:-0.3px;color:var(--texto-oscuro)}
.airis-footer-logo span{color:var(--airis-blue)}
.airis-footer-link{
  font-family:var(--font-mono);font-size:11px;color:var(--texto-medio);
  text-decoration:none;transition:color .2s;
}
.airis-footer-link:hover{color:var(--airis-blue)}

/* ==== Modal "Gestionar mi reserva" ==== */
.gestionar-link{
  font-family:var(--font-mono);font-size:11px;color:var(--texto-medio);
  background:none;border:none;cursor:pointer;text-decoration:underline;
  padding:0;margin-top:4px;
}
.gestionar-link:hover{color:var(--airis-blue)}
.modal-overlay{
  display:none;position:fixed;inset:0;background:rgba(10,15,46,0.55);
  z-index:100;align-items:center;justify-content:center;padding:16px;
}
.modal-overlay.open{display:flex}
.modal-box{
  background:var(--card-bg);border-radius:var(--r-lg);padding:26px 22px;
  max-width:440px;width:100%;max-height:85vh;overflow-y:auto;
  box-shadow:0 20px 60px rgba(10,15,46,0.25);
}
.modal-close{
  float:right;background:none;border:none;font-size:20px;cursor:pointer;
  color:var(--texto-medio);line-height:1;padding:4px;
}
.modal-title{font-weight:800;font-size:19px;color:var(--navy);margin-bottom:6px;clear:both}
.modal-hint{font-size:13px;color:var(--texto-medio);margin-bottom:18px;line-height:1.5}
.modal-tel-row{display:flex;gap:8px;margin-bottom:8px}
.modal-tel-row select{flex:0 0 118px}
.modal-tel-row input{flex:1}
.modal-btn{
  width:100%;font-family:var(--font-display);font-weight:700;font-size:14px;
  padding:12px;border-radius:100px;border:none;cursor:pointer;
  background:var(--azul);color:var(--blanco);margin-top:6px;
}
.modal-btn:disabled{opacity:0.5;cursor:not-allowed}
.reserva-item{
  border:1.5px solid rgba(81,112,255,0.15);border-radius:var(--r);
  padding:14px;margin-top:12px;
}
.reserva-item-row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.reserva-item-label{color:var(--texto-medio)}
.reserva-item-val{font-weight:700;color:var(--navy)}
.reserva-cancel-btn{
  width:100%;margin-top:10px;font-family:var(--font-display);font-weight:700;
  font-size:12.5px;padding:9px;border-radius:100px;border:1.5px solid var(--coral);
  background:none;color:var(--coral);cursor:pointer;
}
.reserva-cancel-btn:hover{background:var(--coral);color:var(--blanco)}
.modal-empty{font-size:13px;color:var(--texto-medio);text-align:center;padding:16px 0}
.modal-msg{font-size:13px;text-align:center;padding:10px;border-radius:var(--r);margin-top:10px}
.modal-msg.ok{background:rgba(139,170,124,0.12);color:var(--azul)}
.modal-msg.err{background:rgba(201,123,74,0.12);color:var(--coral)}
</style>
</head>
<body>

<div class="logo-badge" id="logoBadge"></div>

<div class="mock-banner" id="mockBanner"></div>

<div class="top">
  <div class="top-eyebrow" id="topEyebrow"></div>
  <div class="top-title" id="topTitle">Reserva tu mesa</div>
  <div class="top-sub" id="topSub"></div>
</div>

<div class="progress-wrap">
  <div class="progress-bar" id="progressBar"></div>
  <div class="progress-label">
    <span id="progressStepLabel">Paso 1 de 5</span>
    <span id="progressStepName">Elige el espacio</span>
  </div>
</div>

<div class="widget">

  <div class="step active" data-step="1">
    <div class="step-title" id="step1Title"></div>
    <div class="step-hint" id="step1Hint"></div>
    <div class="salon-grid" id="salonGrid">
      <div class="time-loading">Cargando salones...</div>
    </div>
    <div class="nav-row">
      <button class="btn btn-next" id="next1" disabled></button>
    </div>
  </div>

  <div class="step" data-step="2">
    <div class="step-title" id="step2Title"></div>
    <div class="step-hint">Incluí a todos los comensales de la mesa.</div>
    <div class="personas-box">
      <button class="stepper-btn" id="personasMinus">−</button>
      <div class="personas-num" id="personasNum">2</div>
      <button class="stepper-btn" id="personasPlus">+</button>
    </div>
    <div class="personas-quick" id="personasQuick"></div>
    <div id="grupoGrandeBox" style="display:none;text-align:center;margin-top:18px;padding:16px;background:var(--paper);border-radius:var(--r);border:1.5px dashed rgba(81,112,255,0.3)">
      <p style="font-size:13px;color:var(--texto-medio);margin-bottom:10px;line-height:1.5" id="grupoGrandeTexto"></p>
      <a id="grupoGrandeBtn" href="#" style="display:inline-block;font-family:var(--font-display);font-weight:700;font-size:13.5px;padding:11px 20px;border-radius:100px;background:var(--coral);color:var(--blanco);text-decoration:none"></a>
    </div>
    <div class="nav-row">
      <button class="btn btn-back" id="back2"></button>
      <button class="btn btn-next" id="next2"></button>
    </div>
  </div>

  <div class="step" data-step="3">
    <div class="step-title" id="step3Title"></div>
    <div class="step-hint" id="disponibilidadHint"></div>
    <div id="salonResumenRow" class="salon-resumen-row">
      <span id="salonResumenTexto"></span>
      <a href="#" id="cambiarSalonLink" class="cambiar-salon-link"></a>
    </div>
    <span class="section-mini-label">Fecha</span>
    <div class="date-scroll-wrap">
      <button class="date-arrow date-arrow-left" id="dateArrowLeft" aria-label="Fechas anteriores">‹</button>
      <div class="date-scroll" id="dateScroll"></div>
      <button class="date-arrow date-arrow-right" id="dateArrowRight" aria-label="Más fechas">›</button>
    </div>
    <span class="section-mini-label">Horario</span>
    <div class="time-groups" id="timeGrid"></div>
    <div class="nav-row">
      <button class="btn btn-back" id="back3"></button>
      <button class="btn btn-next" id="next3" disabled></button>
    </div>
  </div>

  <div class="step" data-step="4">
    <div class="step-title" id="step4Title"></div>
    <div class="step-hint" id="step4Hint"></div>
    <div class="form-field">
      <label for="nombreInput" id="labelNombre"></label>
      <input type="text" id="nombreInput" autocomplete="name">
      <div class="field-error" id="nombreError"></div>
    </div>
    <div class="form-field">
      <label for="telInput" id="labelTelefono"></label>
      <div class="tel-row">
        <select id="prefijoSelect"></select>
        <input type="tel" id="telInput" autocomplete="tel">
      </div>
      <div class="field-error" id="telError"></div>
    </div>
    <div class="nav-row">
      <button class="btn btn-back" id="back4"></button>
      <button class="btn btn-next" id="next4"></button>
    </div>
  </div>

  <div class="step" data-step="5">
    <div class="step-title" id="step5Title"></div>
    <div class="step-hint" id="step5Hint"></div>
    <div class="summary-card" id="summaryCard"></div>
    <div class="nav-row">
      <button class="btn btn-back" id="back5"></button>
      <button class="btn btn-next" id="confirmBtn"></button>
    </div>

/* Detecta el prefijo telefónico más probable según el idioma/región
   del dispositivo del visitante (ej. 'es-MX' -> México, 'pt-BR' ->
   Brasil, 'en-US' -> Estados Unidos). Si no se puede determinar,
   respalda en Argentina (primer mercado real de Airis) -- nunca
   rompe, siempre devuelve algo usable. */
function detectarPrefijoDefault(){
  const raw = (navigator.language || navigator.userLanguage || '').toUpperCase();
  const partes = raw.split('-');
  const region = partes.length > 1 ? partes[1] : null;
  if(region){
    const match = CONFIG.prefijos.find(p => p.iso === region);
    if(match) return match.code;
  }
  const ar = CONFIG.prefijos.find(p => p.iso === 'AR');
  return ar ? ar.code : CONFIG.prefijos[0].code;
}

/* Trae nombre, prefijo telefónico y marca (logo/colores) del
   restaurante desde Supabase. Si las columnas de marca todavía no
   existen (no corriste el SQL), reintenta pidiendo solo las columnas
   base y usa CONFIG.brandPorDefecto para lo visual. */
async function cargarRestaurante(){
  const sb = window.supabase.createClient(CONFIG.supabase.url, CONFIG.supabase.anonKey);

  const columnasCompletas = 'id, name, phone_prefix, timezone, whatsapp_numero, logo_type, logo_value, color_primario, color_oscuro, color_secundario, color_texto_oscuro, color_texto_medio, color_bg, color_card, bg_image';
  let { data, error } = await sb.from('restaurants').select(columnasCompletas).eq('slug', CONFIG.supabase.restaurantSlug).single();

  if(error){
    console.warn('[Pura Vida widget] columnas de marca no encontradas todavía (¿corriste el SQL?), sigo solo con datos base:', error.message);
    const basico = await sb.from('restaurants').select('id, name, phone_prefix, timezone, whatsapp_numero').eq('slug', CONFIG.supabase.restaurantSlug).single();
    if(basico.error) throw basico.error;
    data = basico.data;
  }
  return data;
}

function aplicarMarca(restaurante){
  const b = CONFIG.brandPorDefecto;
  const root = document.documentElement.style;
  root.setProperty('--azul', restaurante.color_primario || b.colorPrimario);
  root.setProperty('--navy', restaurante.color_oscuro || b.colorOscuro);
  root.setProperty('--coral', restaurante.color_secundario || b.colorSecundario);
  root.setProperty('--texto-oscuro', restaurante.color_texto_oscuro || b.colorTextoOscuro);
  root.setProperty('--texto-medio', restaurante.color_texto_medio || b.colorTextoMedio);
  root.setProperty('--paper', restaurante.color_bg || b.bgColor);
  root.setProperty('--card-bg', restaurante.color_card || b.cardColor);
  document.body.classList.add('marca-lista');
  // --blanco NO se pisa acá a propósito: es el color de texto/ícono
  // sobre fondos de acento (botones, chips seleccionados) -- tiene
  // que quedar blanco siempre, en cualquier tema, claro u oscuro.

  const bgImage = restaurante.bg_image || b.bgImage;
  if(bgImage){
    document.body.style.backgroundImage = `linear-gradient(rgba(255,255,255,0.55), rgba(255,255,255,0.55)), url('${bgImage}')`;
    document.body.style.backgroundSize = 'cover';
    document.body.style.backgroundPosition = 'center';
    document.body.style.backgroundAttachment = 'fixed';
  }

  const logoEl = document.getElementById('logoBadge');
  if(!restaurante.logo_value){
    // Sin logo real cargado todavía -- se oculta el recuadro
    // entero, en vez de mostrar el emoji genérico de relleno.
    logoEl.style.display = 'none';
  }else{
    logoEl.style.display = '';
    const logoType = restaurante.logo_type || b.logoType;
    const logoValue = restaurante.logo_value;
    if(logoType === 'image'){
      logoEl.innerHTML = `<img src="${logoValue}" alt="${restaurante.name}">`;
    }else{
      logoEl.textContent = logoValue;
    }
  }
}

   independiente del valor de state.personas, se puede activar desde

   con el stepper +/-. */
function mostrarCartelGrupo(){
  const grupoBox = document.getElementById('grupoGrandeBox');

  grupoBox.style.display = 'block';

/* Deriva un pedido de grupo grande: abre WhatsApp con el mensaje
   pre-cargado (en el idioma detectado, para que el cliente no espere
   nada) y, en paralelo, avisa al Endpoint 3 para que quede registrado
   en Contacto/derivaciones, sin bloquear la apertura de WhatsApp si
   ese llamado tarda o falla. */
function derivarGrupoGrande(){
  const salon = CONFIG.salones.find(s => s.id === state.salon);
  const nombreSalon = salon ? salon.nombre : '';
  const texto = T.whatsappMensaje(nombreSalon, state.personas);
  const numeroWhatsapp = restaurantData?.whatsapp_numero || CONFIG.whatsappNumero;
  const url = `https://wa.me/${numeroWhatsapp}?text=${encodeURIComponent(texto)}`;
  window.open(url, '_blank');

  if(!CONFIG.MOCK_MODE && salon){
    fetch(CONFIG.webhookGrupoGrande, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        restaurant_id: restaurantData.id,
        room_slug: salon.id,
        nombre: 'Consulta desde la página',
        telefono: '',
        personas: state.personas,
      }),
    }).catch(e => console.warn('[Pura Vida widget] no se pudo registrar la derivación (no bloqueante):', e));
  }
}

const DOW = ['DOM','LUN','MAR','MIE','JUE','VIE','SAB'];
const MON = ['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];

function renderFechas(){
  const scroll = document.getElementById('dateScroll');
  scroll.innerHTML = '';
  const today = new Date();
  // Días cerrados del salón elegido -- 100% dinámico, viene de
  // rooms.closed_days de Supabase, nunca hardcodeado. Cada restaurante
  // (y cada salón dentro de un mismo restaurante) puede tener sus
  // propios días de cierre semanal.
  const salonActual = CONFIG.salones.find(s => s.id === state.salon);
  const closedDays = salonActual?.closedDays || [];

  const resumenTexto = document.getElementById('salonResumenTexto');
  if(resumenTexto) resumenTexto.textContent = salonActual ? `${salonActual.icon} ${salonActual.nombre}` : '';

  if(state.salon){
    console.log('[Pura Vida widget] DIAGNÓSTICO -- salón elegido:', state.salon,
      '| días cerrados de este salón:', closedDays,
      '| excepciones cargadas para este salón:', EXCEPCIONES_APERTURA[state.salon] ? [...EXCEPCIONES_APERTURA[state.salon]] : 'ninguna');
  }

  for(let i=0;i<CONFIG.diasDisponibles;i++){
    const d = new Date(today);
    d.setDate(today.getDate()+i);
    const yyyy = d.getFullYear();
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    const iso = `${yyyy}-${mm}-${dd}`;
    const esCerradoNormal = closedDays.includes(d.getDay());
    // Si hoy está normalmente cerrado, pero hay un aviso real y activo
    // de Apertura Especial para esta fecha puntual en este salón, la
    // excepción gana -- el día se muestra abierto igual.
    const tieneExcepcion = EXCEPCIONES_APERTURA[state.salon]?.has(iso) || false;
    const esCerrado = esCerradoNormal && !tieneExcepcion;
    const chip = document.createElement('div');
    chip.className = 'date-chip'
      + (state.fechaISO === iso ? ' selected' : '')
      + (esCerrado ? ' closed' : '');
    chip.innerHTML = `
      <div class="date-dow">${DOW[d.getDay()]}</div>
      <div class="date-num">${d.getDate()}</div>
      <div class="date-mon">${MON[d.getMonth()]}</div>
    `;
    chip.dataset.iso = iso;
    if(!esCerrado){
      chip.addEventListener('click', () => seleccionarFecha(iso, d));
    }
    scroll.appendChild(chip);
  }

  // Si ya había una fecha elegida de una vuelta anterior (ej: el cliente
  // volvió a cambiar de salón con "Cambiar espacio" y ahora regresa acá),
  // el chip queda marcado como seleccionado arriba, pero el grid de
  // horarios todavía tiene los datos del salón anterior -- nunca se
  // vuelve a pedir solo por reconstruir los chips. Dos casos:
  const chipPrevio = state.fechaISO ? scroll.querySelector(`.date-chip[data-iso="${state.fechaISO}"]`) : null;
  if(chipPrevio && !chipPrevio.classList.contains('closed')){
    // La fecha sigue siendo válida para el salón actual -> refrescamos
    // los horarios reales para esa combinación salón+fecha nueva.
    cargarHorarios();
  } else if(state.fechaISO){
    // La fecha ya no es válida para el nuevo salón (día cerrado sin
    // excepción) -> se limpia la selección para no dejar arrastrado
    // un horario que ya no corresponde.
    state.fechaISO = null; state.fechaLabel = null; state.hora = null; state.horaISO = null;
    document.getElementById('timeGrid').innerHTML = '';
    document.getElementById('next3').disabled = true;
  }
}

/* Selecciona una fecha SIN reconstruir todo el selector -- solo mueve
   la clase "selected" al chip correspondiente. Reconstruir todo el DOM
   (como hacía antes) resetea el scroll horizontal a la posición
   inicial en cualquier navegador -- por eso, al elegir una fecha
   lejana (scrolleando con las flechas), la pantalla "saltaba" de
   vuelta al principio, dando la sensación de que el click no
   funcionaba. Confirmado como causa real, corregido acá. */
function seleccionarFecha(iso, d){
  state.fechaISO = iso;
  state.fechaLabel = `${d.getDate()} de ${MON[d.getMonth()].charAt(0)+MON[d.getMonth()].slice(1).toLowerCase()}`;
  state.hora = null;
  document.querySelectorAll('.date-chip').forEach(el => el.classList.remove('selected'));
  const chipEl = document.querySelector(`.date-chip[data-iso="${iso}"]`);
  if(chipEl) chipEl.classList.add('selected');
  cargarHorarios();
}

/* Las flechas desplazan el selector una "pantalla" por click. No se
   deshabilitan automáticamente en los extremos -- ese cálculo dependía
   de medir el ancho del selector, que puede estar oculto (display:none,
   antes de llegar al paso 3) y medir 0, dejando la flecha bloqueada
   por error incluso habiendo más fechas para mostrar. Más simple y
   más confiable: siempre activas, sin efecto si ya no hay más para
   ese lado. */
document.getElementById('dateArrowLeft').addEventListener('click', () => {
  const scroll = document.getElementById('dateScroll');
  scroll.scrollBy({ left: -scroll.clientWidth * 0.8, behavior: 'smooth' });
});
document.getElementById('dateArrowRight').addEventListener('click', () => {
  const scroll = document.getElementById('dateScroll');
  scroll.scrollBy({ left: scroll.clientWidth * 0.8, behavior: 'smooth' });
});

/* Consulta el Endpoint 1 real (disponibilidad-real). En modo de prueba
   devuelve horarios de ejemplo. Devuelve un array de {iso, label} -- ya
   no strings sueltos, porque ahora necesitamos el ISO exacto para poder
   crear la reserva real después, sin volver a calcular nada. */
async function obtenerHorarios(roomSlug, fechaISO){
  if(CONFIG.MOCK_MODE){
    await new Promise(r => setTimeout(r, 500));
    return MOCK_HORARIOS.map(h => ({ iso: `${fechaISO}T${h}:00-03:00`, label: h }));
  }
  try{
    const res = await fetch(CONFIG.webhookHorarios, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        restaurant_id: restaurantData.id,
        room_slug: roomSlug,
        fecha: fechaISO,
        personas: state.personas,
      }),
    });
    const data = await res.json();
    return (data.horarios || []).map(h => ({ iso: h.horario_iso, label: h.horario_label }));
  }catch(e){
    console.error('[Pura Vida widget] error consultando horarios', e);
    return [];
  }
}

async function cargarHorarios(){
  const grid = document.getElementById('timeGrid');
  grid.innerHTML = `<div class="time-loading">${T.horariosLoading}</div>`;
  document.getElementById('next3').disabled = true;

  const salon = CONFIG.salones.find(s => s.id === state.salon);
  const horarios = await obtenerHorarios(salon.id, state.fechaISO);

  grid.innerHTML = '';
  if(horarios.length === 0){
    grid.innerHTML = `<div class="time-empty">${T.horariosEmpty}</div>`;
    return;
  }

  // Agrupa por franja del día (mañana/tarde/noche) leyendo la hora
  // directo del ISO -- así, si un restaurante tiene un solo turno
  // (ej. solo de noche), nunca aparece un título de franja vacío o
  // sobrando; el título solo se muestra cuando de verdad hace falta
  // separar 2 o más franjas con horarios reales.
  const franjas = [
    { id: 'manana', label: T.franjaManana, desde: 0, hasta: 12 },
    { id: 'tarde',  label: T.franjaTarde,  desde: 12, hasta: 19 },
    { id: 'noche',  label: T.franjaNoche,  desde: 19, hasta: 24 },
  ];
  const grupos = franjas.map(f => ({
    ...f,
    items: horarios.filter(h => {
      const hora = parseInt(h.iso.slice(11, 13), 10);
      return hora >= f.desde && hora < f.hasta;
    })
  })).filter(g => g.items.length > 0);

  const mostrarTitulos = grupos.length > 1;

  grupos.forEach(g => {
    if(mostrarTitulos){
      const titulo = document.createElement('div');
      titulo.className = 'time-franja-label';
      titulo.textContent = g.label;
      grid.appendChild(titulo);
    }
    const fila = document.createElement('div');
    fila.className = 'time-grid';
    g.items.forEach(h => {
      const slot = document.createElement('div');
      slot.className = 'time-slot' + (state.horaISO === h.iso ? ' selected' : '');
      slot.textContent = h.label;
      slot.addEventListener('click', () => {
        state.hora = h.label;
        state.horaISO = h.iso;
        cargarHorarios();
        document.getElementById('next3').disabled = false;
      });
      fila.appendChild(slot);
    });
    grid.appendChild(fila);
  });
}

function validarDatos(){
  const nombre = document.getElementById('nombreInput').value.trim();
  const tel = document.getElementById('telInput').value.trim();
  const telDigits = tel.replace(/\D/g,'');

  const nombreOk = nombre.length > 3 && nombre.includes(' ');
  document.getElementById('nombreError').classList.toggle('show', !nombreOk);

  const telOk = telDigits.length >= 6;
  document.getElementById('telError').classList.toggle('show', !telOk);

  if(nombreOk && telOk){
    state.nombre = nombre;
    state.telefono = telDigits;
    return true;
  }
  return false;
}

/* Crea la reserva real vía el Endpoint 2 (confirmar-reserva). En modo
   de prueba solo simula el envío. */
async function crearReserva(){
  const salon = CONFIG.salones.find(s => s.id === state.salon);
  const payload = {
    restaurant_id: restaurantData.id,
    room_slug: salon.id,
    horario_iso: state.horaISO,
    personas: state.personas,
    nombre: state.nombre,
    telefono: `${state.prefijo}${state.telefono}`,
    notas: '',
  };

  if(CONFIG.MOCK_MODE){
    await new Promise(r => setTimeout(r, 600));
    console.log('[Pura Vida widget] MOCK — se hubiera creado esta reserva:', payload);
    return { success: true };
  }

  try{
    const res = await fetch(CONFIG.webhookReserva, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload),
    });
    return await res.json();
  }catch(e){
    console.error('[Pura Vida widget] error creando la reserva', e);
    return { success: false };
  }
}

  const btn = document.getElementById('confirmBtn');
  btn.disabled = true;
  btn.textContent = T.btnConfirmando;

  const resultado = await crearReserva();

  if(resultado.success){
    document.getElementById('successTitle').textContent = T.successTitleOk;
    document.getElementById('successSub').textContent = CONFIG.MOCK_MODE
      ? T.successSubMock
      : T.successSubOk;
  }else{
    document.getElementById('successTitle').textContent = T.successTitleErr;
    // Nota: 'resultado.message' viene del backend (Endpoint 2), hoy solo
    // en español -- si no hay mensaje específico, usamos el genérico ya
    // traducido. Internacionalizar el backend queda como mejora futura.
    document.getElementById('successSub').textContent = resultado.message
      || T.successSubErrDefault;
  }
  goToStep(6);
  btn.disabled = false;
  btn.textContent = T.btnConfirmar;
});

const DIAS_SEMANA = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

function closedDaysToTexto(closedDays){
  if(!closedDays || closedDays.length === 0) return null;
  const nombres = closedDays.map(d => DIAS_SEMANA[d]);
  return 'Cerrado ' + nombres.join(' y ');
}

/* Trae los salones activos de este restaurante directo de Supabase
   (tabla rooms, filtrando por el slug del restaurante). Si algo falla
   (RLS, red, etc.) usa CONFIG.salonesRespaldo para que la página
   nunca quede rota. */
async function cargarSalones(){
  const sb = window.supabase.createClient(CONFIG.supabase.url, CONFIG.supabase.anonKey);
  const { data, error } = await sb
    .from('rooms')
    .select('slug, name, emoji, ghl_calendar_id, descripcion_fisica, closed_days, max_people, max_personas_por_reserva, restaurants!inner(slug)')
    .eq('restaurants.slug', CONFIG.supabase.restaurantSlug)
    .eq('active', true)
    .order('sort_order');

  if(error) throw error;
  if(!data || data.length === 0) throw new Error('No hay salones activos cargados para este restaurante en Supabase.');

  return data.map(row => ({
    id: row.slug,
    nombre: row.name,
    icon: row.emoji || '🍽️',
    calendarId: row.ghl_calendar_id,
    desc: row.descripcion_fisica || '',
    nota: closedDaysToTexto(row.closed_days),
    closedDays: row.closed_days || [],
    maxPeople: row.max_people || CONFIG.personasMaxPorDefecto,
    maxPersonasPorReserva: row.max_personas_por_reserva || 8,
  }));
}

/* Trae los avisos activos de "Apertura Especial" del restaurante, y
   arma un Set con las fechas (YYYY-MM-DD) que cada salón tiene abiertas
   por excepción -- para no bloquear en el selector un día que
   normalmente está cerrado (rooms.closed_days) pero que un aviso real
   activo abrió puntualmente. Se guarda en EXCEPCIONES_APERTURA, un
   objeto { room_slug: Set(fechas) }, calculado una sola vez al cargar. */
let EXCEPCIONES_APERTURA = {};
async function cargarExcepcionesAperturaEspecial(){
  try{
    const sb = window.supabase.createClient(CONFIG.supabase.url, CONFIG.supabase.anonKey);
    const { data, error } = await sb.from('airis_avisos')
      .select('fecha_desde, datos')
      .eq('restaurant_id', restaurantData.id)
      .eq('categoria', 'apertura_especial')
      .eq('activo', true);
    if(error) throw error;

    const mapa = {};
    (data || []).forEach(aviso => {
      const rooms = aviso.datos?.rooms || [];
      // Normalizamos a los primeros 10 caracteres (YYYY-MM-DD) --
      // Supabase puede devolver fecha_desde como fecha pura o con hora
      // y zona horaria incluida según el tipo real de la columna, y una
      // comparación exacta de texto fallaba en silencio si no coincidía
      // carácter por carácter. Esto funciona sea cual sea el formato real.
      const fechaNormalizada = String(aviso.fecha_desde).slice(0, 10);
      rooms.forEach(r => {
        if(!mapa[r.room_slug]) mapa[r.room_slug] = new Set();
        mapa[r.room_slug].add(fechaNormalizada);
      });
    });
    EXCEPCIONES_APERTURA = mapa;
    console.log('[Pura Vida widget] excepciones de apertura especial cargadas:', EXCEPCIONES_APERTURA);
  }catch(e){
    console.warn('[Pura Vida widget] no se pudieron cargar las excepciones de apertura especial (no bloqueante):', e);
    EXCEPCIONES_APERTURA = {};
  }
}

async function init(){
  aplicarIdioma();
  try{
    restaurantData = await cargarRestaurante();
    document.title = `${T.pageTitle} — ${restaurantData.name}`;
    document.getElementById('topEyebrow').textContent = restaurantData.name;
    aplicarMarca(restaurantData);
    if(restaurantData.phone_prefix){
      const yaExiste = CONFIG.prefijos.find(p => p.code === restaurantData.phone_prefix);
      if(yaExiste) state.prefijo = restaurantData.phone_prefix;
    }

    CONFIG.salones = await cargarSalones();
    await cargarExcepcionesAperturaEspecial();
    if(!CONFIG.MOCK_MODE) document.getElementById('mockBanner').classList.add('hidden');

    renderSalones();
    renderPersonas();
    renderFechas();
    renderPrefijos();
    renderProgress();
  }catch(e){
    console.error('[Pura Vida widget] error cargando datos de Supabase:', e);
    document.body.classList.add('marca-lista');
    mostrarErrorCarga(T.errorCarga);
  }
}
/* ============================================================
   Modal "Gestionar mi reserva" -- búsqueda por teléfono y
   cancelación. Independiente del flujo de 6 pasos de arriba,
   se puede abrir en cualquier momento desde el link del footer.
   ============================================================ */
function renderPrefijosModal(){
  const sel = document.getElementById('modalPrefijoSelect');
  sel.innerHTML = '';
  CONFIG.prefijos.forEach(p => {
    const opt = document.createElement('option');
    opt.value = p.code;
    opt.textContent = p.label;
    sel.appendChild(opt);
  });
  sel.value = state.prefijo;
}

function abrirModalGestionar(){
  document.getElementById('modalGestionar').classList.add('open');
  document.getElementById('modalResultados').innerHTML = '';
  document.getElementById('modalTelInput').value = '';
  renderPrefijosModal();
}
function cerrarModalGestionar(){
  document.getElementById('modalGestionar').classList.remove('open');
}
document.getElementById('abrirGestionar').addEventListener('click', abrirModalGestionar);
document.getElementById('cerrarGestionar').addEventListener('click', cerrarModalGestionar);
document.getElementById('modalGestionar').addEventListener('click', (e) => {
  if(e.target.id === 'modalGestionar') cerrarModalGestionar();
});

async function buscarMisReservas(){
  const prefijo = document.getElementById('modalPrefijoSelect').value;
  const telDigits = document.getElementById('modalTelInput').value.trim().replace(/\D/g,'');
  const telefono = `${prefijo}${telDigits}`;
  const btn = document.getElementById('modalBuscarBtn');
  const resultados = document.getElementById('modalResultados');

  btn.disabled = true;
  btn.textContent = T.modalBuscando;
  resultados.innerHTML = '';

  try{
    const res = await fetch(CONFIG.webhookBuscarReservas, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ restaurant_id: restaurantData.id, telefono }),
    });
    const data = await res.json();
    renderReservasEncontradas(data.reservas || []);
  }catch(e){
    console.error('[Pura Vida widget] error buscando reservas', e);
    renderReservasEncontradas([]);
  }

  btn.disabled = false;
  btn.textContent = T.modalBuscarBtn;
}
document.getElementById('modalBuscarBtn').addEventListener('click', buscarMisReservas);

function renderReservasEncontradas(reservas){
  const cont = document.getElementById('modalResultados');
  cont.innerHTML = '';

  if(reservas.length === 0){
    cont.innerHTML = `<div class="modal-empty">${T.modalEmpty}</div>`;
    return;
  }

  reservas.forEach(r => {
    const fecha = new Date(r.reserved_at);
    const fechaLabel = fecha.toLocaleString(LANG, { timeZone: restaurantData?.timezone || 'America/Argentina/Buenos_Aires', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
    const item = document.createElement('div');
    item.className = 'reserva-item';
    item.innerHTML = `
      <div class="reserva-item-row"><span class="reserva-item-label">${T.summaryEspacio}</span><span class="reserva-item-val">${r.room_name}</span></div>
      <div class="reserva-item-row"><span class="reserva-item-label">${T.summaryFecha}</span><span class="reserva-item-val">${fechaLabel}</span></div>
      <div class="reserva-item-row"><span class="reserva-item-label">${T.summaryPersonas}</span><span class="reserva-item-val">${r.people_count} ${T.modalReservaPersonas}</span></div>
      <button class="reserva-cancel-btn" data-id="${r.id}">${T.modalCancelarBtn}</button>
    `;
    item.querySelector('.reserva-cancel-btn').addEventListener('click', (e) => cancelarReserva(r.id, e.target));
    cont.appendChild(item);
  });
}

async function cancelarReserva(reservationId, btn){
  if(!confirm(T.modalConfirmarCancelar)) return;

  btn.disabled = true;
  btn.textContent = T.modalCancelando;

  try{
    const res = await fetch(CONFIG.webhookCancelarReserva, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ reservation_id: reservationId }),
    });
    const data = await res.json();
    const cont = document.getElementById('modalResultados');
    if(data.success){
      cont.innerHTML = `<div class="modal-msg ok">${T.modalCanceladaOk}</div>`;
    }else{
      cont.innerHTML = `<div class="modal-msg err">${T.modalCanceladaErr}</div>`;
    }
  }catch(e){
    console.error('[Pura Vida widget] error cancelando reserva', e);
    document.getElementById('modalResultados').innerHTML = `<div class="modal-msg err">${T.modalCanceladaErr}</div>`;
  }
}

init();
</script>

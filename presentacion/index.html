<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Airis — Presentación</title>
<meta name="description" content="Mirá cómo Airis atiende, reserva y gestiona por vos: agente conversacional 24/7 en WhatsApp e Instagram, link de reservas, app del equipo y métricas para el dueño.">
<link rel="canonical" href="https://www.airisworld.com/presentacion/">
<!-- Open Graph (WhatsApp, Instagram, Facebook, LinkedIn) -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Airis · Gastronomía Inteligente">
<meta property="og:locale" content="es_AR">
<meta property="og:url" content="https://www.airisworld.com/presentacion/">
<meta property="og:title" content="Airis — Presentación del servicio para restaurantes">
<meta property="og:description" content="Reservas, recordatorios y reseñas en automático, con un agente conversacional trabajando 24/7. Mirá cómo funciona en 3 minutos.">
<meta property="og:image" content="https://www.airisworld.com/presentacion/og-image.jpg">
<meta property="og:image:secure_url" content="https://www.airisworld.com/presentacion/og-image.jpg">
<meta property="og:image:type" content="image/jpeg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Airis · Gastronomía Inteligente — presentación del servicio">
<!-- Twitter / X -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Airis — Presentación del servicio para restaurantes">
<meta name="twitter:description" content="Reservas, recordatorios y reseñas en automático, con un agente conversacional trabajando 24/7.">
<meta name="twitter:image" content="https://www.airisworld.com/presentacion/og-image.jpg">
<meta name="theme-color" content="#080f2d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  /* ===== CONFIG VISUAL ===== */
  :root{
    --bg:#080f2d; --panel:#111a45; --line:rgba(120,140,255,.28);
    --azul:#4a6cff; --azul-2:#6d8bff; --txt:#eef1ff; --muted:#9aa4d6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
  .mono{font-family:"JetBrains Mono",ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase}

  /* ===== ESCENARIO ===== */
  #stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
  #frameWrap{flex:1;width:100%;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}
  /* el "frame" mantiene la proporción exacta del video para que los hotspots en % caigan justo sobre cada demo */
  #frame{position:relative;aspect-ratio:16/9;width:min(100%, calc((100dvh - 64px) * 16 / 9));max-height:100%;}
  body.v #frame{aspect-ratio:9/16;width:min(100%, calc((100dvh - 64px) * 9 / 16))}
  #frame video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:var(--bg);display:none}
  body:not(.v) #vH, body.v #vV{display:block}

  /* ===== HOTSPOTS (zona clickeable sobre cada demo) ===== */
  .hot{position:absolute;display:none;border-radius:18px;cursor:zoom-in;outline:1.5px solid transparent;transition:outline-color .25s, background .25s}
  .hot.on{display:block}
  .hot:hover{outline-color:rgba(109,139,255,.8);background:rgba(74,108,255,.08)}
  .hot .badge{position:absolute;right:10px;top:10px;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;
    background:rgba(8,15,45,.75);border:1px solid var(--line);backdrop-filter:blur(6px);opacity:.0;transform:scale(.8);transition:.25s}
  .hot.on .badge{opacity:1;transform:scale(1)}
  .hot svg{width:18px;height:18px}
  .hot.phone .badge{width:28px;height:28px;right:8px;top:8px}
  .hot.phone svg{width:13px;height:13px}

  @keyframes bubblePulse{0%{box-shadow:0 0 0 0 rgba(74,108,255,.55)}70%{box-shadow:0 0 0 14px rgba(74,108,255,0)}100%{box-shadow:0 0 0 0 rgba(74,108,255,0)}}

  /* ===== PLAY GRANDE / FIN ===== */
  #bigPlay{position:absolute;inset:0;display:none;place-items:center;background:rgba(8,15,45,.35);pointer-events:none}
  #bigPlay span{pointer-events:auto;cursor:pointer}
  #hots{position:absolute;inset:0;pointer-events:none;z-index:2}
  .hot{pointer-events:auto}
  #bigPlay.on{display:grid}
  #bigPlay span{width:84px;height:84px;border-radius:50%;background:var(--azul);display:grid;place-items:center;animation:bubblePulse 2.2s infinite}
  #bigPlay svg{width:34px;height:34px;margin-left:5px}
  #endCard{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(8,15,45,.82);backdrop-filter:blur(4px);text-align:center;padding:24px}
  #endCard.on{display:flex}
  #endCard h2{font-size:clamp(22px,3.4vw,40px);font-weight:700;letter-spacing:-.02em}
  #endCard h2 em{font-style:normal;color:var(--azul-2)}
  #endCard p{color:var(--muted);max-width:460px;font-size:15px}
  .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}
  .cta{display:inline-flex;align-items:center;gap:8px;padding:13px 22px;border-radius:24px 10px 24px 10px;font-weight:600;text-decoration:none;transition:border-radius .3s}
  .cta:hover{border-radius:10px 24px 10px 24px}
  .cta.pri{background:var(--azul);color:#fff;animation:bubblePulse 2.2s infinite}
  .cta.sec{border:1px solid var(--line);color:var(--txt)}

  /* ===== BARRA DE CONTROLES ===== */
  #bar{width:100%;max-width:1200px;height:64px;flex:none;display:flex;align-items:center;gap:12px;padding:0 16px calc(env(safe-area-inset-bottom)) 16px}
  .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;border:1px solid transparent;transition:.2s}
  .ic:hover{border-color:var(--line);background:rgba(255,255,255,.04)}
  .ic svg{width:20px;height:20px}
  #seek{position:relative;flex:1;height:40px;cursor:pointer;touch-action:none}
  #track{position:absolute;left:0;right:0;top:50%;height:4px;margin-top:-2px;border-radius:4px;background:rgba(255,255,255,.14)}
  #fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--azul);border-radius:4px}
  .chap{position:absolute;top:50%;height:8px;margin-top:-4px;border-radius:4px;background:rgba(109,139,255,.35)}
  .chap:hover{background:rgba(109,139,255,.6)}
  #knob{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;box-shadow:0 0 0 4px rgba(74,108,255,.35)}
  #tip{position:absolute;bottom:34px;transform:translateX(-50%);padding:5px 9px;border-radius:8px;background:var(--panel);border:1px solid var(--line);font-size:11px;white-space:nowrap;display:none;pointer-events:none}
  #time{font-size:11px;color:var(--muted);flex:none;min-width:86px;text-align:right}
  #rotBtn{display:none;align-items:center;gap:8px;height:40px;padding:0 14px;border-radius:14px 6px 14px 6px;border:1px solid var(--line);font-size:13px;font-weight:600;flex:none}
  #rotBtn svg{width:18px;height:18px}
  body.touch #rotBtn{display:inline-flex}
  body.touch #fsBtn{display:none}
  @media (max-width:520px){ #time{display:none} #bar{gap:8px;padding-left:10px;padding-right:10px} #rotBtn{padding:0 11px;font-size:12px} }


  /* ===== LIGHTBOX DE DEMOS ===== */
  #lb{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;background:rgba(4,8,26,.94);backdrop-filter:blur(10px)}
  #lb.on{display:flex;animation:fade .25s}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  #lbHead{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px}
  #lbHead .t{flex:1;min-width:0}
  #lbHead .k{font-size:11px;color:var(--azul-2)}
  #lbHead h3{font-size:17px;font-weight:600;line-height:1.25}
  #lbBody{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:0 16px}
  #lbVid{max-width:100%;max-height:100%;border-radius:14px;background:#000;box-shadow:0 20px 80px rgba(0,0,0,.5)}
  #lbFoot{display:flex;align-items:center;justify-content:safe center;gap:8px;padding:12px 16px calc(14px + env(safe-area-inset-bottom));overflow-x:auto;scrollbar-width:none}
  #lbFoot::-webkit-scrollbar{display:none}
  .pill{flex:none;white-space:nowrap}
  .pill{padding:8px 13px;border-radius:999px;border:1px solid var(--line);font-size:12px;color:var(--muted);transition:.2s}
  .pill:hover{color:var(--txt)}
  .pill.cur{background:var(--azul);border-color:var(--azul);color:#fff}
</style>
</head>
<body>

<div id="stage">
  <div id="frameWrap">
    <div id="frame">
      <video id="vH" playsinline muted preload="auto" poster="poster-16x9.jpg"><source src="presentacion-16x9.mp4" type="video/mp4"></video>
      <video id="vV" playsinline muted preload="metadata" poster="poster-9x16.jpg"><source src="presentacion-9x16.mp4" type="video/mp4"></video>
      <div id="hots"></div>
      <button id="bigPlay" aria-label="Reproducir"><span><svg viewBox="0 0 24 24" fill="#fff"><path d="M7 4.5v15l13-7.5z"/></svg></span></button>
      <div id="endCard">
        <div class="mono" style="font-size:11px;color:var(--azul-2)">// El primer paso</div>
        <h2>Accedé a tu <em>auditoría gratuita.</em></h2>
        <p>Te mostramos el sistema trabajando en vivo y los resultados de nuestros clientes implementándolo en sus restaurantes.</p>
        <div class="row">
          <a class="cta pri" id="ctaLink" href="#" target="_blank" rel="noopener">Quiero mi auditoría →</a>
          <button class="cta sec" id="replay">Ver de nuevo</button>
        </div>
      </div>
    </div>
  </div>

  <div id="bar">
    <button class="ic" id="playBtn" aria-label="Reproducir / pausar"></button>
    <div id="seek"><div id="track"><div id="fill"></div></div><div id="knob"></div><div id="tip"></div></div>
    <div id="time" class="mono">0:00 / 0:00</div>
    <button id="rotBtn" aria-label="Ver en horizontal">
      <svg id="icoH" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2.5" y="6.5" width="19" height="11" rx="2.5"/><path d="M18.5 10.5v3"/></svg>
      <svg id="icoV" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none"><rect x="6.5" y="2.5" width="11" height="19" rx="2.5"/><path d="M10.5 18.5h3"/></svg>
      <span id="rotLbl">Ver en horizontal</span>
    </button>
    <button class="ic" id="fsBtn" aria-label="Pantalla completa">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
  </div>
</div>

<div id="lb" role="dialog" aria-modal="true" aria-labelledby="lbTitle">
  <div id="lbHead">
    <div class="t"><div class="k mono" id="lbKicker"></div><h3 id="lbTitle"></h3></div>
    <button class="ic" id="lbFs" aria-label="Pantalla completa"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <button class="ic" id="lbClose" aria-label="Cerrar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </div>
  <div id="lbBody"><video id="lbVid" playsinline muted loop controls></video></div>
  <div id="lbFoot"></div>
</div>

<script>
/* ============ CONFIG ============ */
// Botón final "Quiero mi auditoría" → WhatsApp de Airis (+54 9 261 534-7036) con mensaje predeterminado
const CTA_URL = "https://wa.me/5492615347036?text=Hola%20Airis%21%20Vi%20la%20presentaci%C3%B3n%20del%20servicio%20y%20quiero%20m%C3%A1s%20info%20sobre%20el%20sistema%20y%20los%20planes.%0AGracias%21";

// Tramos de cada demo dentro de la presentación (segundos) + zona clickeable en % del cuadro [x, y, ancho, alto]
const DEMOS = [
  { n:"01", bloque:"Agente conversacional", title:"Responde, informa y deriva.",            src:"demo-1-agente.mp4",          land:false, from:32,  to:60,  h:[64,8,27,88],  v:[22,39,56,55] },
  { n:"02", bloque:"Link de reservas",      title:"Link de reservas personalizado.",        src:"demo-2-link-reservas.mp4",   land:false, from:60,  to:90,  h:[61,8,31,88],  v:[18,39,64,55] },
  { n:"03", bloque:"App operativa · parte 1", title:"El servicio de tu restaurante, coordinado en tiempo real.", src:"demo-3-app-equipo-1.mp4", land:true, from:90, to:111, h:[38,13,60,78], v:[2,49,96,40] },
  { n:"03", bloque:"App operativa · parte 2", title:"Una sola App para todas las acciones del equipo.",        src:"demo-4-app-equipo-2.mp4", land:true, from:111, to:146, h:[38,13,60,78], v:[2,46,96,42] },
  { n:"04", bloque:"App del dueño",         title:"Las métricas más importantes de tu restaurante.", src:"demo-5-dashboard-dueno.mp4", land:false, from:146, to:175, h:[62,7,30,90], v:[26,47,48,49] },
];

/* ============ ESTADO ============ */
const $ = s => document.querySelector(s);
const vH = $("#vH"), vV = $("#vV"), body = document.body;
const isTouch = matchMedia("(pointer:coarse)").matches || "ontouchstart" in window;
if (isTouch) body.classList.add("touch");
let forceH = false;          // el usuario pidió versión horizontal estando en vertical
let wasPlayingBeforeLB = false;
let started = false;
const cur = () => body.classList.contains("v") ? vV : vH;
$("#ctaLink").href = CTA_URL;

const ICON_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15l13-7.5z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4.5" width="4" height="15" rx="1"/><rect x="14" y="4.5" width="4" height="15" rx="1"/></svg>';
const fmt = t => { t = Math.max(0, Math.floor(t||0)); return Math.floor(t/60)+":"+String(t%60).padStart(2,"0"); };

/* ============ VERTICAL / HORIZONTAL ============ */
function isPortrait(){ return innerHeight > innerWidth; }
function applyLayout(){
  const portrait = isPortrait();
  body.classList.toggle("portrait", portrait);
  if (!portrait) { forceH = false; hideToast(); }             // si giró el celu, ya está en horizontal
  const wantV = portrait && !forceH;
  const isV = body.classList.contains("v");
  if (wantV !== isV) swapTo(wantV);
  const narrow = innerWidth < 400;
  $("#rotLbl").textContent = forceH ? (narrow ? "Vertical" : "Volver a vertical") : (narrow ? "Horizontal" : "Ver en horizontal");
  $("#icoH").style.display = forceH ? "none" : "";
  $("#icoV").style.display = forceH ? "" : "none";
  $("#rotBtn").style.display = (isTouch && portrait) ? "" : "none";
  placeHots();
}
function swapTo(vertical){
  const from = cur(), to = vertical ? vV : vH;
  const t = from.currentTime || 0, playing = !from.paused;
  from.pause();
  body.classList.toggle("v", vertical);
  to.preload = "auto";
  const go = () => { try { to.currentTime = t; } catch(e){} if (playing) to.play().catch(()=>{}); tick(); };
  if (to.readyState >= 1) go(); else to.addEventListener("loadedmetadata", go, { once:true });
}
addEventListener("resize", applyLayout);
addEventListener("orientationchange", () => setTimeout(applyLayout, 250));

$("#rotBtn").onclick = async () => {
  if (forceH) { // volver a vertical
    forceH = false; hideToast();
    if (document.fullscreenElement) await document.exitFullscreen().catch(()=>{});
    try { screen.orientation.unlock(); } catch(e){}
    applyLayout(); return;
  }
  forceH = true; applyLayout();
  // Android / Chrome: pantalla completa + girar a horizontal automáticamente
  const el = document.documentElement;
  if (el.requestFullscreen) {
    try { await el.requestFullscreen({ navigationUI:"hide" }); await screen.orientation.lock("landscape"); return; } catch(e){}
  }
};
function hideToast(){}

/* ============ HOTSPOTS + BOTÓN VER EN GRANDE ============ */
const hotsEl = $("#hots");
DEMOS.forEach((d,i) => {
  const b = document.createElement("button");
  b.className = d.land ? "hot" : "hot phone"; b.setAttribute("aria-label","Ver en grande: "+d.bloque);
  b.innerHTML = '<span class="badge"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg></span>';
  b.onclick = e => { e.stopPropagation(); openLB(i); };
  hotsEl.appendChild(b); d.el = b;
});
function placeHots(){
  const key = body.classList.contains("v") ? "v" : "h";
  DEMOS.forEach(d => { const [x,y,w,h] = d[key]; Object.assign(d.el.style,{left:x+"%",top:y+"%",width:w+"%",height:h+"%"}); });
}
let activeDemo = -1;
function updateDemo(t){
  const i = DEMOS.findIndex(d => t >= d.from && t < d.to);
  if (i === activeDemo) return;
  activeDemo = i;
  DEMOS.forEach((d,j) => d.el.classList.toggle("on", j===i));
}

/* ============ LIGHTBOX ============ */
const lb = $("#lb"), lbVid = $("#lbVid");
DEMOS.forEach((d,i) => {
  const p = document.createElement("button"); p.className="pill"; p.textContent = d.n+" · "+d.bloque;
  p.onclick = () => openLB(i); $("#lbFoot").appendChild(p); d.pill = p;
});
function openLB(i){
  const d = DEMOS[i];
  if (!lb.classList.contains("on")) { wasPlayingBeforeLB = !cur().paused; cur().pause(); }
  $("#lbKicker").textContent = "Bloque " + d.n + " · " + d.bloque;
  $("#lbTitle").textContent = d.title;
  DEMOS.forEach((x,j)=>x.pill.classList.toggle("cur", j===i));
  d.pill.scrollIntoView({inline:"center",block:"nearest"});
  lbVid.src = d.src; lbVid.currentTime = 0; lbVid.play().catch(()=>{});
  lb.classList.add("on");
}
function closeLB(){
  if (document.fullscreenElement === lbVid) document.exitFullscreen().catch(()=>{});
  lbVid.pause(); lbVid.removeAttribute("src"); lbVid.load();
  lb.classList.remove("on");
  if (wasPlayingBeforeLB) cur().play().catch(()=>{});
}
$("#lbClose").onclick = closeLB;
$("#lbBody").onclick = e => { if (e.target.id === "lbBody") closeLB(); };
$("#lbFs").onclick = () => {
  if (lbVid.requestFullscreen) lbVid.requestFullscreen().then(()=>{ if (DEMOS.find(d=>lbVid.src.endsWith(d.src))?.land) screen.orientation?.lock?.("landscape").catch(()=>{}); }).catch(()=>{});
  else if (lbVid.webkitEnterFullscreen) lbVid.webkitEnterFullscreen(); // iPhone
};
addEventListener("keydown", e => {
  if (lb.classList.contains("on")) { if (e.key === "Escape") closeLB(); return; }
  if (e.key === " " ) { e.preventDefault(); togglePlay(); }
  if (e.key === "ArrowRight") seekTo(cur().currentTime + 5);
  if (e.key === "ArrowLeft") seekTo(cur().currentTime - 5);
});

/* ============ REPRODUCCIÓN / BARRA ============ */
function togglePlay(){ const v = cur(); if (v.paused || v.ended) { $("#endCard").classList.remove("on"); v.play().catch(()=>{}); } else v.pause(); }
$("#playBtn").onclick = togglePlay;
$("#bigPlay").onclick = togglePlay;
$("#replay").onclick = () => { seekTo(0); $("#endCard").classList.remove("on"); cur().play(); };
$("#frame").addEventListener("click", e => { if (e.target.tagName === "VIDEO") togglePlay(); });

[vH, vV].forEach(v => {
  v.addEventListener("timeupdate", () => { if (v === cur()) tick(); });
  v.addEventListener("play", () => { if (v === cur()) { started = true; tick(); } });
  v.addEventListener("pause", () => { if (v === cur()) tick(); });
  v.addEventListener("ended", () => { if (v === cur()) { $("#endCard").classList.add("on"); tick(); } });
  v.addEventListener("loadedmetadata", () => { if (v === cur()) { buildChapters(); tick(); } });
});

function tick(){
  const v = cur(), d = v.duration || 223.5, t = v.currentTime || 0;
  $("#fill").style.width = (t/d*100)+"%";
  $("#knob").style.left = (t/d*100)+"%";
  $("#time").textContent = fmt(t)+" / "+fmt(d);
  $("#playBtn").innerHTML = (v.paused || v.ended) ? ICON_PLAY : ICON_PAUSE;
  $("#bigPlay").classList.toggle("on", v.paused && !v.ended && !lb.classList.contains("on") && !scrubbing);
  updateDemo(t);
}
function buildChapters(){
  const d = cur().duration || 223.5, tr = $("#track");
  tr.querySelectorAll(".chap").forEach(c=>c.remove());
  DEMOS.forEach(x => { const c=document.createElement("div"); c.className="chap";
    c.style.left=(x.from/d*100)+"%"; c.style.width=((x.to-x.from)/d*100 - .4)+"%"; tr.appendChild(c); });
}
function seekTo(t){ const v = cur(); v.currentTime = Math.max(0, Math.min(t, (v.duration||223.5) - .1)); tick(); }

// arrastrar la barra
const seek = $("#seek"), tip = $("#tip"); let scrubbing = false;
const posT = e => { const r = seek.getBoundingClientRect(); return Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)) * (cur().duration||223.5); };
seek.addEventListener("pointerdown", e => { scrubbing = true; seek.setPointerCapture(e.pointerId); seekTo(posT(e)); });
seek.addEventListener("pointermove", e => {
  const t = posT(e), r = seek.getBoundingClientRect();
  if (scrubbing) seekTo(t);
  if (e.pointerType === "mouse" || scrubbing) {
    const dm = DEMOS.find(d => t >= d.from && t < d.to);
    tip.textContent = fmt(t) + (dm ? " · " + dm.bloque : ""); tip.style.left = (e.clientX - r.left)+"px"; tip.style.display = "block";
  }
});
seek.addEventListener("pointerup", () => { scrubbing = false; tip.style.display="none"; tick(); });
seek.addEventListener("pointerleave", () => { if (!scrubbing) tip.style.display="none"; });

// pantalla completa (desktop)
$("#fsBtn").onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen?.().catch(()=>{});
};
document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement && forceH && isPortrait()) { forceH = false; applyLayout(); } });

/* ============ INICIO ============ */
body.classList.toggle("v", isPortrait());
applyLayout();
tick();
// autoplay (es mudo, los navegadores lo permiten); si lo bloquean, queda el botón de play
cur().play().catch(() => tick());
</script>

/* ============================================================
   PROTOTIPO — widget propio (no usa el widget nativo de GHL).
   Este es el patrón pensado para clientes SIN calendario nativo
   configurado todavía. Consulta disponibilidad real vía webhooks
   de n8n en vez de embeber la interfaz de GHL.

   Mientras CONFIG.MOCK_MODE = true, los horarios son de prueba
   y "crear reserva" no escribe nada real — así se puede revisar
   el diseño y el flujo sin depender de que los webhooks ya existan.
   Cuando Lucas tenga los dos webhooks (ver especificación aparte),
   solo hay que completar las URLs de abajo y poner MOCK_MODE en false.
   ============================================================ */

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --azul:#5170FF;
  --navy:#0A0F2E;
  --violeta:#C9B28A;
  --coral:#EB9292;
  --paper:#F4F4F8;
  --blanco:#FFFFFF;
  --card-bg:#FFFFFF;
  --texto-oscuro:#0A0F2E;
  --texto-medio:#3a3f5c;
  --airis-blue:#5170FF;
  --font-display:'Bricolage Grotesque',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
  --r:16px;
  --r-lg:24px;
}
body{opacity:0;transition:opacity .25s ease}
body.marca-lista{opacity:1}

/* ============================================================
   📌 LOGO SIEMPRE FIJO, TOMA 2 (21/08) -- pedido explícito de Camila:
   "necesito que se quede QUIETO... si o si". La solución anterior
   (position:absolute + JS que recalculaba top/left en cada scroll)
   seguía sin funcionar en el navegador real que probó -- algunos
   navegadores in-app no disparan el evento "scroll" de forma
   confiable o no exponen bien window.scrollY, así que ese cálculo
   quedaba desincronizado.
   Esta vez el enfoque es distinto y no depende de ningún evento de
   scroll ni de que el navegador soporte bien position:fixed: html/body
   quedan con overflow:hidden (el documento en sí NUNCA scrollea) y
   todo el contenido de la página vive adentro de #pageScroll, un div
   propio con overflow-y:auto que es el único que se mueve. El logo
   (hermano de #pageScroll, no hijo) queda position:absolute respecto
   de body -- como body nunca scrollea, el logo nunca se mueve, sin
   trucos ni cálculos: es geometría simple, no comportamiento del
   navegador. Esto es lo mismo que se usa en apps híbridas para tener
   una barra superior fija de verdad en cualquier WebView. */
/* overscroll-behavior:none -- CLAVE (21/08, segunda vuelta del bug del
   logo): sin esto, aunque html/body tengan overflow:hidden, Safari/Chrome
   en celular igual "encadena" el gesto de scroll cuando el dedo llega al
   final de #page-scroll y sigue rebotando la página entera por abajo
   (el efecto elástico nativo del navegador) -- eso es lo que hacía que
   el logo pareciera moverse en el celular real de Camila, aunque en
   desktop (sin dedos, sin rebote elástico) se veía perfecto. Esta
   propiedad le dice al navegador que no encadene ni rebote el documento
   una vez que el scroll interno llega a su límite. */
html,body{height:100vh;height:100dvh;overflow:hidden;margin:0;overscroll-behavior:none}
body{
  position:relative;
  background:var(--paper);
  color:var(--texto-oscuro);
  font-family:var(--font-display);
  -webkit-font-smoothing:antialiased;
}
/* Pedido de Camila (21/08, tercera vuelta): además del logo, que el
   nombre del restaurante, "Reserva tu mesa" y la barra de pasos
   también queden fijos arriba -- que lo único que se mueva al
   scrollear sea la burbuja (el contenido de cada paso) para abajo.
   #appShell es un contenedor flex en columna: #pageHeader no scrollea
   (crece lo que necesite su contenido) y #pageScroll ocupa el resto
   del alto disponible y es el único que scrollea -- min-height:0 es
   necesario para que un hijo flex pueda scrollear en vez de estirarse
   más allá del contenedor. */
.app-shell{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
}
.page-header{
  flex:0 0 auto;
  /* 76px (antes 104px) -- pedido de Camila (21/08): acercar el título
     al logo. El logo mide 46px y arranca a 20px del borde, o sea que
     termina en 66px -- 76px deja apenas 10px de aire libre. */
  padding:76px 16px 0;
}
/* Idea de Camila (21/08, cuarta vuelta): que la burbuja naranja en sí
   quede clavada en su lugar (ni se mueve ni cambia de tamaño), y que
   si el contenido de un paso no entra, scrollee puertas adentro de la
   burbuja nada más -- no la página completa. Por eso #pageScroll deja
   de ser el que scrollea (ahora es puro layout, flex en columna) y ese
   trabajo pasa a .widget (la burbuja), que sí tiene overflow-y:auto.
   El "gestionar reserva" y el pie de página de Airis quedan como
   hermanos de .widget adentro de este mismo flex, siempre visibles,
   sin scrollear nunca. */
.page-scroll{
  flex:1 1 auto;
  min-height:0;
  display:flex;flex-direction:column;
  padding:0 16px 16px;
}

.mock-banner{
  max-width:640px;margin:0 auto 20px;
  background:rgba(235,146,146,0.12);border:1px solid rgba(235,146,146,0.35);
  color:#b23b3b;font-family:var(--font-mono);font-size:11px;font-weight:600;
  padding:10px 16px;border-radius:12px;text-align:center;letter-spacing:0.02em;
}
.mock-banner.hidden{display:none}

.logo-badge{
  /* position:absolute (NO fixed) a propósito -- ver comentario largo
     junto a pinLogoBadge() en el <script>: varios navegadores in-app
     (Instagram/WhatsApp/TikTok) directamente ignoran position:fixed y
     lo tratan como si no estuviera, haciendo que el elemento scrollee
     con la página. Acá se logra el mismo efecto visual de "fijo" a mano
     con JS, que funciona en cualquier navegador sin depender de que
     soporte bien position:fixed. */
  position:absolute;top:20px;left:20px;z-index:50;
  width:128px;height:46px;border-radius:12px;
  background:#FFFFFF;
  display:flex;align-items:center;justify-content:center;
  padding:6px 10px;box-sizing:border-box;
  font-size:34px;
  box-shadow:0 8px 20px rgba(10,15,46,0.18);
  overflow:hidden;
  will-change:top,left;
}
/* object-fit:contain (no cover) porque el logo de Shiiko es un isologo
   horizontal transparente -- con "cover" se recortaría, acá se ve
   completo dentro del badge blanco, legible contra cualquier bg_image. */
.logo-badge img{width:100%;height:100%;object-fit:contain;display:block}

.top{max-width:640px;margin:0 auto 20px;text-align:center}
/* display:none -- pedido de Camila (21/08): sacar el nombre del
   restaurante ("Shiiko Sushi") de arriba de "Reserva tu mesa". El JS
   le sigue asignando el texto (queda disponible por si algún día se
   quiere volver a mostrar), pero no se ve. */
.top-eyebrow{display:none;font-weight:800;font-size:16px;letter-spacing:-0.2px;color:var(--texto-medio);margin-bottom:6px}
.top-title{font-weight:800;font-size:clamp(26px,7vw,34px);letter-spacing:-1px;color:var(--navy);margin-bottom:8px}
.top-sub{font-size:14px;color:var(--texto-medio);line-height:1.5;max-width:420px;margin:0 auto 28px}

/* margin-bottom 14px (antes 28px) -- pedido de Camila (21/08): achicar
   el espacio puntual entre la barra de pasos y la burbuja. */
.progress-wrap{max-width:640px;margin:0 auto 14px}
.progress-bar{display:flex;gap:6px;margin-bottom:10px}
.progress-seg{flex:1;height:4px;border-radius:100px;background:rgba(81,112,255,0.15);overflow:hidden}
.progress-seg-fill{height:100%;width:0%;background:var(--azul);border-radius:100px}
.progress-seg.done .progress-seg-fill,.progress-seg.active .progress-seg-fill{width:100%}
.progress-label{font-family:var(--font-mono);font-size:11px;color:var(--azul);letter-spacing:0.08em;text-transform:uppercase;display:flex;justify-content:space-between}
.progress-label span:last-child{color:var(--texto-medio)}

.widget{
  width:100%;max-width:640px;margin:0 auto;
  background:var(--card-bg);
  border:1.5px solid rgba(81,112,255,0.15);
  border-radius:var(--r-lg);
  padding:28px 22px;
  box-shadow:0 12px 40px rgba(10,15,46,0.06);
  /* la burbuja es ahora el elemento que scrollea puertas adentro,
     no la página -- ver comentario largo junto a #pageScroll arriba. */
  flex:1 1 auto;min-height:0;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  overscroll-behavior:contain;scroll-behavior:smooth;
  /* display:flex, SIN justify-content acá -- pedido de Camila (21/08,
     cuarta vuelta): con justify-content:center puesto directo en
     .widget, se centraba el paso ENTERO como un solo bloque, título
     incluido -- eso hacía que el título ("Elige el espacio", "¿Cuántas
     personas...", etc) quedara a distinta altura en cada paso según
     cuánto contenido tuviera debajo. Ahora el centrado se mueve adentro
     de cada paso (ver .step-body más abajo): el título queda siempre
     pegado arriba, a la misma altura en los 5 pasos, y solo lo que va
     DESPUÉS del título (texto de ayuda + contenido + botones) se centra
     en el espacio que sobra. */
  display:flex;flex-direction:column;
}
.step{display:none;animation:fadeIn .4s ease}
/* flex column + flex-grow:1: el paso activo ocupa todo el alto
   disponible de .widget (que es su padre flex) cuando el contenido es
   corto, para que .step-title quede arriba fijo y .step-body (ver
   abajo) pueda repartirse y centrar el resto del espacio.
   OJO -- acá había un bug (21/08, quinta vuelta, reportado por Camila:
   "no se mueve el contenido de la burbuja"): al ponerle min-height:0
   además de flex-grow, el paso quedaba habilitado para ENCOGERSE por
   debajo de su propio contenido en vez de desbordar -- así, un paso
   con más contenido que el alto disponible (ej: paso 3 con muchos
   horarios) se comprimía/recortaba en vez de activar el scroll interno
   de .widget. flex-shrink:0 es la corrección: el paso puede CRECER para
   llenar el espacio libre (paso corto → se centra bien), pero nunca se
   encoge por debajo de lo que su contenido necesita (paso largo →
   desborda .widget, que sigue teniendo overflow-y:auto y scrollea). */
.step.active{display:flex;flex-direction:column;flex:1 0 auto}
/* Todo lo que va después del título de cada paso (hint + contenido +
   nav-row) vive adentro de este wrapper -- pedido de Camila (21/08):
   quería el título siempre a la misma altura, pero el resto "con
   espacio, más centrado, más armonioso" como ya estaba. safe center
   con center como respaldo, mismo motivo que antes: evita que el
   contenido se recorte arriba si es más largo que el alto disponible.
   flex-shrink:0 por el mismo motivo que en .step.active de arriba: sin
   esto, este bloque también podía comprimirse en vez de desbordar y
   dejar scrollear a .widget. */
.step-body{
  flex:1 0 auto;
  display:flex;flex-direction:column;
  justify-content:center;
  justify-content:safe center;
}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* var(--blanco) a propósito, NO var(--navy): la burbuja general
   (--card-bg) ahora es el naranja de marca, así que los títulos de
   cada paso (violeta antes) tienen que pasar a blanco para leerse.
   El título grande de arriba (.top-title, "Reserva tu mesa") es
   aparte y se queda en violeta -- ese va sobre la foto de fondo, no
   sobre la burbuja naranja. */
.step-title{font-weight:800;font-size:22px;letter-spacing:-0.7px;color:var(--blanco);margin-bottom:6px}
/* color:var(--blanco), NO var(--texto-medio) -- pedido de Camila
   (21/08): las descripciones debajo de cada título de paso pasan a
   blanco (antes gris oscuro, pensado para la burbuja blanca original). */
.step-hint{font-size:13.5px;color:var(--blanco);line-height:1.5;margin-bottom:24px}

.salon-grid{display:grid;grid-template-columns:1fr;gap:10px}
.salon-card{
  display:flex;align-items:center;gap:14px;
  border:1.5px solid rgba(81,112,255,0.15);
  border-radius:var(--r);padding:14px 16px;
  cursor:pointer;transition:border-color .2s,background .2s;
  background:var(--paper);
}
.salon-card:hover{border-color:rgba(81,112,255,0.4)}
.salon-card.selected{border-color:var(--azul);background:rgba(81,112,255,0.06)}
.salon-icon{
  width:44px;height:44px;border-radius:12px;flex-shrink:0;
  background:rgba(81,112,255,0.12);
  display:flex;align-items:center;justify-content:center;font-size:20px;
}
.salon-info h4{font-size:15px;font-weight:700;color:var(--navy);margin-bottom:2px}
.salon-info p{font-size:12.5px;color:var(--texto-medio)}
.salon-check{
  margin-left:auto;width:20px;height:20px;border-radius:50%;
  border:1.5px solid rgba(81,112,255,0.3);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.salon-card.selected .salon-check{background:var(--azul);border-color:var(--azul)}
.salon-card.selected .salon-check::after{content:'✓';color:var(--blanco);font-size:12px;font-weight:700}

/* padding-top 10px (antes 36px) -- pedido de Camila (21/08): acercar el
   selector de personas al texto "Incluí a todos los comensales..." en
   el paso 2. Solo afecta este paso -- .personas-box no se usa en
   ningún otro. */
.personas-box{display:flex;align-items:center;justify-content:center;gap:28px;padding:10px 0 24px}
.stepper-btn{
  width:52px;height:52px;border-radius:50%;
  border:1.5px solid rgba(81,112,255,0.25);background:var(--paper);
  font-size:22px;font-weight:700;color:var(--azul);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:background .2s,border-color .2s;
}
.stepper-btn:hover{background:rgba(81,112,255,0.1);border-color:var(--azul)}
.stepper-btn:disabled{opacity:0.35;cursor:not-allowed}
.personas-num{font-size:40px;font-weight:800;color:var(--blanco);min-width:64px;text-align:center;letter-spacing:-2px}
.personas-quick{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.quick-chip{
  font-family:var(--font-mono);font-size:12.5px;font-weight:500;
  border:1.5px solid rgba(81,112,255,0.2);border-radius:100px;
  /* background fijo en blanco (var(--blanco)), a propósito NO
     var(--card-bg): si usara --card-bg se volvería del mismo naranja
     que la burbuja general y el chip dejaría de verse como un chip. */
  padding:7px 16px;cursor:pointer;color:var(--texto-medio);background:var(--blanco);
  transition:border-color .2s,color .2s;
}
.quick-chip:hover{border-color:var(--azul);color:var(--azul);background:rgba(81,112,255,0.06)}
/* .selected aparte de :hover y con su propia regla (antes compartían
   el mismo estilo clarito, pensado para fondo blanco): relleno sólido +
   texto blanco + anillo, mismo patrón que .date-chip.selected /
   .time-slot.selected, para que se distinga bien contra la burbuja
   naranja en vez de quedar un texto naranja casi invisible. */
.quick-chip.selected{border-color:var(--azul);color:var(--blanco);background:var(--azul);box-shadow:0 0 0 2px var(--blanco)}

.date-scroll{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:none}
.date-scroll::-webkit-scrollbar{display:none}
.date-scroll-wrap{position:relative;display:flex;align-items:center;gap:4px}
.date-scroll-wrap .date-scroll{flex:1;min-width:0}
.date-arrow{
  flex-shrink:0;width:30px;height:30px;border-radius:50%;border:1.5px solid rgba(81,112,255,0.25);
  /* color:var(--blanco), NO var(--azul): con --card-bg ahora naranja
     (igual que --azul), la flecha quedaba naranja sobre naranja =
     invisible. */
  background:var(--card-bg);color:var(--blanco);font-size:18px;line-height:1;cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:opacity 0.15s;
}
.date-arrow:hover{border-color:var(--azul)}
.date-arrow:disabled{opacity:0.25;cursor:default;pointer-events:none}
.date-chip{
  flex-shrink:0;min-width:62px;
  border:1.5px solid rgba(81,112,255,0.18);border-radius:14px;
  padding:10px 6px;text-align:center;cursor:pointer;background:var(--paper);
  transition:border-color .2s,background .2s;
}
.date-chip:hover{border-color:rgba(81,112,255,0.45)}
/* box-shadow blanco agregado: --azul y --card-bg son ahora el mismo
   naranja, así que sin este anillo el chip seleccionado se "funde"
   con la burbuja de atrás y se pierde el borde. */
.date-chip.selected{border-color:var(--azul);background:var(--azul);color:var(--blanco);box-shadow:0 0 0 2px var(--blanco)}
.date-chip.closed{opacity:0.35;cursor:not-allowed;pointer-events:none;background:var(--paper)}
.date-dow{font-family:var(--font-mono);font-size:10px;text-transform:uppercase;letter-spacing:0.05em;opacity:0.7}
.date-num{font-size:19px;font-weight:800;margin:3px 0}
.date-mon{font-family:var(--font-mono);font-size:9.5px;text-transform:uppercase;opacity:0.7}

.time-groups{margin-top:18px;min-height:52px}
.time-groups .time-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:0;margin-bottom:14px;min-height:0}
.time-groups .time-grid:last-child{margin-bottom:0}
.time-franja-label{font-family:var(--font-mono);font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--texto-medio);margin:14px 0 8px}
.time-franja-label:first-child{margin-top:0}
.time-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px;min-height:52px}
.time-slot{
  border:1.5px solid rgba(81,112,255,0.18);border-radius:12px;
  padding:11px 6px;text-align:center;font-size:13.5px;font-weight:600;
  color:var(--navy);cursor:pointer;background:var(--paper);
  transition:border-color .2s,background .2s,color .2s;
}
.time-slot:hover{border-color:rgba(81,112,255,0.45)}
.time-slot.selected{border-color:var(--azul);background:var(--azul);color:var(--blanco);box-shadow:0 0 0 2px var(--blanco)}
.time-loading,.time-empty{
  grid-column:1/-1;text-align:center;font-family:var(--font-mono);
  font-size:12px;color:var(--texto-medio);padding:16px 0;
}
/* color:var(--blanco), NO var(--azul) -- mismo motivo que .date-arrow:
   iba naranja sobre naranja. */
.section-mini-label{font-family:var(--font-mono);font-size:10.5px;letter-spacing:0.1em;text-transform:uppercase;color:var(--blanco);margin:20px 0 4px;display:block}
/* margin-top 4px (antes 20px, heredado de .section-mini-label) --
   pedido de Camila (21/08): con la burbuja de "Salón Shiiko" sacada,
   acercar "Fecha" al texto "Consultando disponibilidad real" de arriba.
   Solo afecta esta etiqueta puntual (id), no toca "Horario" ni el resto. */
#fechaMiniLabel{margin-top:4px}

.salon-resumen-row{
  display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px 14px;
  padding:10px 14px;margin-bottom:6px;
  background:var(--paper);border:1px solid rgba(81,112,255,0.15);border-radius:12px;
}
.salon-resumen-row span:first-child{font-size:13px;color:var(--texto-medio);font-weight:600}

.form-field{margin-bottom:18px}
.form-field label{display:block;font-size:12.5px;font-weight:700;color:var(--blanco);margin-bottom:7px;letter-spacing:0.01em}
.form-field input,.form-field select{
  width:100%;border:1.5px solid rgba(81,112,255,0.2);border-radius:12px;
  padding:13px 14px;font-family:var(--font-display);font-size:15px;color:var(--texto-oscuro);
  background:var(--paper);outline:none;transition:border-color .2s;
}
.form-field input:focus,.form-field select:focus{border-color:var(--azul)}
.tel-row{display:flex;gap:8px}
.tel-row select{flex:0 0 118px}
.tel-row input{flex:1}
.field-error{font-size:12px;color:var(--coral);margin-top:6px;display:none;font-weight:600}
.field-error.show{display:block}

/* Pedido de Camila (21/08): resumen del paso 5 pasa de fondo oscuro
   con letras blancas a fondo blanco con letras negras. #0A0F2E es
   literal (negro/casi negro) a propósito -- ni --navy ni --texto-oscuro
   sirven acá porque aplicarMarca() los pisa con el violeta del
   cliente, y esto tiene que quedar negro siempre. */
.summary-card{background:var(--blanco);border-radius:var(--r);padding:20px;margin-bottom:22px}
.summary-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid rgba(10,15,46,0.08)}
.summary-row:last-child{border-bottom:none}
.summary-row-label{font-family:var(--font-mono);font-size:11px;text-transform:uppercase;letter-spacing:0.06em;color:rgba(10,15,46,0.55)}
.summary-row-val{font-size:14px;font-weight:700;color:#0A0F2E;text-align:right}

/* .success-box también necesita su propio centrado ahora: antes lo
   centraba .widget (justify-content:center sobre TODO el paso activo),
   pero eso se sacó de .widget para que el título de los pasos 1-5 no
   se moviera (ver comentario junto a .step-body). El paso 6 no tiene
   el problema de "título a distinta altura" (es un solo bloque, ícono +
   título + texto), así que simplemente se centra entero como antes. */
.success-box{text-align:center;padding:20px 0 4px;flex:1 0 auto;display:flex;flex-direction:column;justify-content:center;justify-content:safe center}
.success-icon{
  width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,0.18);
  display:flex;align-items:center;justify-content:center;margin:0 auto 18px;font-size:30px;color:var(--blanco);
}

.nav-row{display:flex;gap:10px;margin-top:26px}
.btn{
  font-family:var(--font-display);font-weight:700;font-size:14.5px;
  padding:14px 22px;border-radius:100px;border:none;cursor:pointer;
  text-decoration:none;transition:transform .2s,opacity .2s;text-align:center;
}
.btn:disabled{opacity:0.4;cursor:not-allowed}
.btn-back{background:var(--paper);color:var(--navy);border:1.5px solid rgba(81,112,255,0.18);flex:0 0 auto}
/* background:var(--navy) (violeta) + color:var(--blanco) -- pedido de
   Camila (21/08), reemplaza la prueba anterior en amarillo. */
.btn-next{background:var(--navy);color:var(--blanco);flex:1}
.btn-next:not(:disabled):hover{transform:translateY(-2px);opacity:0.92}

@media(min-width:600px){
  .salon-grid{grid-template-columns:1fr 1fr}
  .widget{padding:36px 40px}
}

/* margin-top 14px (antes 28px) y layout en fila (antes columna) -- pedido
   de Camila (21/08, sexta vuelta): acercar "¿Necesitas cancelar?" del
   "Desarrollado por airis." de abajo, Y de paso poner "Desarrollado por
   airis." a la izquierda con "www.airisworld.com" a la derecha, en la
   misma línea, en vez de uno arriba del otro -- eso ahorra el alto de
   una línea entera de texto. Como .widget (la burbuja naranja) tiene
   flex:1 1 auto y ocupa lo que sobra del alto disponible de #pageScroll,
   ese espacio ahorrado en el footer se lo queda automáticamente la
   burbuja -- no hace falta tocar ningún alto fijo de .widget. */
.airis-footer{
  /* width:100% -- sin esto, el margin:auto (que centra el bloque cuando
     el ancho de pantalla supera los 640px) hace que el propio flex
     container se achique al ancho de su contenido ("Desarrollado por
     airis." + link pegados), y ahí justify-content:space-between no
     tiene ningún espacio libre para repartir -- por eso quedaban pegados
     sin nada de aire entremedio. width:100% (tope max-width:640px) es
     el mismo patrón que ya usa .widget más arriba. */
  width:100%;max-width:640px;margin:14px auto 0;
  display:flex;flex-direction:row;align-items:baseline;justify-content:space-between;
}
/* gap 3px (antes 6px) -- pedido de Camila (21/08): el letter-spacing de
   "Desarrollado por" agrega aire extra después de la última letra, así
   que con 6px de gap se veía más separado del isologo "airis." de lo
   que el número sugiere. */
.airis-footer-row{display:flex;align-items:baseline;justify-content:center;gap:3px}
.airis-footer-label{font-size:11px;color:var(--texto-medio);font-family:var(--font-display);letter-spacing:0.04em}
/* Color fijo a propósito (NO var(--texto-oscuro)) -- el isologo "airis."
   del pie de página es la marca de Airis, no la del cliente, y no debe
   cambiar de color aunque aplicarMarca() pise las variables de marca del
   restaurante. Bug encontrado 21/08: heredaba var(--texto-oscuro), por
   eso se veía violeta en Shiiko en vez del color propio de Airis. */
/* font-size 11px (antes 14px) -- pedido de Camila (21/08, séptima vuelta):
   "Desarrollado por" y "airis." quedaban con dos tamaños distintos (el
   isologo se veía más grande que el texto de al lado). Se baja al mismo
   11px que ya usan .airis-footer-label y .airis-footer-link -- el
   tamaño chico estándar que se usa en todo el pie de página / textos
   secundarios de este widget -- así los tres quedan parejos. */
.airis-footer-logo{font-weight:800;font-size:11px;letter-spacing:-0.2px;color:#0A0F2E}
.airis-footer-logo span{color:var(--airis-blue)}
.airis-footer-link{
  font-family:var(--font-display);font-size:11px;color:var(--texto-medio);
  text-decoration:none;transition:color .2s;
}
.airis-footer-link:hover{color:var(--airis-blue)}

/* ==== Modal "Gestionar mi reserva" ==== */
.gestionar-link{
  font-family:var(--font-display);font-size:11px;color:var(--texto-medio);
  background:none;border:none;cursor:pointer;text-decoration:underline;
  padding:0;margin-top:4px;
}
.gestionar-link:hover{color:var(--airis-blue)}
.modal-overlay{
  /* position:absolute (no fixed), mismo motivo que .logo-badge/.page-scroll:
     body ya no scrollea nunca, así que absolute respecto de body cubre
     toda la pantalla igual que fixed, sin depender de que el navegador
     soporte bien position:fixed. */
  display:none;position:absolute;inset:0;background:rgba(10,15,46,0.55);
  z-index:100;align-items:center;justify-content:center;padding:16px;
  overflow-y:auto;
}
.modal-overlay.open{display:flex}
.modal-box{
  background:var(--card-bg);border-radius:var(--r-lg);padding:26px 22px;
  max-width:440px;width:100%;max-height:85vh;overflow-y:auto;
  overscroll-behavior:contain;
  box-shadow:0 20px 60px rgba(10,15,46,0.25);
}
.modal-close{
  float:right;background:none;border:none;font-size:20px;cursor:pointer;
  color:var(--texto-medio);line-height:1;padding:4px;
}
/* .modal-box también usa --card-bg (ahora naranja) para su fondo, así
   que el título del modal "Gestionar mi reserva" necesita el mismo
   ajuste que .step-title. Si preferís que ese modal se quede blanco
   en vez de naranja, avisame y lo desacoplo de --card-bg. */
.modal-title{font-weight:800;font-size:19px;color:var(--blanco);margin-bottom:6px;clear:both}
.modal-hint{font-size:13px;color:var(--texto-medio);margin-bottom:18px;line-height:1.5}
.modal-tel-row{display:flex;gap:8px;margin-bottom:8px}
.modal-tel-row select{flex:0 0 118px}
.modal-tel-row input{flex:1}
.modal-btn{
  width:100%;font-family:var(--font-display);font-weight:700;font-size:14px;
  padding:12px;border-radius:100px;border:none;cursor:pointer;
  background:var(--azul);color:var(--blanco);margin-top:6px;
}
.modal-btn:disabled{opacity:0.5;cursor:not-allowed}
.reserva-item{
  border:1.5px solid rgba(81,112,255,0.15);border-radius:var(--r);
  padding:14px;margin-top:12px;
}
.reserva-item-row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.reserva-item-label{color:var(--texto-medio)}
.reserva-item-val{font-weight:700;color:var(--blanco)}
.reserva-cancel-btn{
  width:100%;margin-top:10px;font-family:var(--font-display);font-weight:700;
  font-size:12.5px;padding:9px;border-radius:100px;border:1.5px solid var(--coral);
  background:none;color:var(--coral);cursor:pointer;
}
.reserva-cancel-btn:hover{background:var(--coral);color:var(--blanco)}
.modal-empty{font-size:13px;color:var(--texto-medio);text-align:center;padding:16px 0}
.modal-msg{font-size:13px;text-align:center;padding:10px;border-radius:var(--r);margin-top:10px}
.modal-msg.ok{background:rgba(139,170,124,0.12);color:var(--azul)}
.modal-msg.err{background:rgba(201,123,74,0.12);color:var(--coral)}
</style>

<body>

<div class="logo-badge" id="logoBadge"></div>

<div class="app-shell" id="appShell">

<div class="page-header" id="pageHeader">

  <div class="mock-banner" id="mockBanner"></div>

  <div class="top">
    <div class="top-eyebrow" id="topEyebrow"></div>

    <div class="top-sub" id="topSub"></div>
  </div>

  <div class="progress-wrap">
    <div class="progress-bar" id="progressBar"></div>
    <div class="progress-label">
      <span id="progressStepLabel">Paso 1 de 5</span>
      <span id="progressStepName">Elige el espacio</span>
    </div>
  </div>

</div><!-- /#pageHeader -->

<div class="page-scroll" id="pageScroll">

<div class="widget" id="widgetCard">

  <div class="step active" data-step="1">
    <div class="step-title" id="step1Title"></div>
    <div class="step-body">
      <div class="step-hint" id="step1Hint"></div>
      <div class="salon-grid" id="salonGrid">
        <div class="time-loading">Cargando salones...</div>
      </div>
      <div class="nav-row">
        <button class="btn btn-next" id="next1" disabled></button>
      </div>
    </div>
  </div>

  <div class="step" data-step="2">
    <div class="step-title" id="step2Title"></div>
    <div class="step-body">
      <div class="step-hint">Incluí a todos los comensales de la mesa.</div>
      <div class="personas-box">
        <button class="stepper-btn" id="personasMinus">−</button>
        <div class="personas-num" id="personasNum">2</div>
        <button class="stepper-btn" id="personasPlus">+</button>
      </div>
      <div class="personas-quick" id="personasQuick"></div>
      <div id="grupoGrandeBox" style="display:none;text-align:center;margin-top:18px;padding:16px;background:var(--paper);border-radius:var(--r);border:1.5px dashed rgba(81,112,255,0.3)">
        <p style="font-size:13px;color:var(--texto-medio);margin-bottom:10px;line-height:1.5" id="grupoGrandeTexto"></p>
        <a id="grupoGrandeBtn" href="#" style="display:inline-block;font-family:var(--font-display);font-weight:700;font-size:13.5px;padding:11px 20px;border-radius:100px;background:var(--navy);color:var(--blanco);text-decoration:none"></a>
      </div>
      <div class="nav-row">
        <button class="btn btn-back" id="back2"></button>
        <button class="btn btn-next" id="next2"></button>
      </div>
    </div>
  </div>

  <div class="step" data-step="3">
    <div class="step-title" id="step3Title"></div>
    <div class="step-body">
      <div class="step-hint" id="disponibilidadHint"></div>

           un solo salón no aporta nada remarcarlo acá. El span#salonResumenTexto
           que la JS seguía llenando ya no existe -- esa asignación está
           protegida con "if(resumenTexto)" así que no rompe nada. -->
      <span class="section-mini-label" id="fechaMiniLabel">Fecha</span>
      <div class="date-scroll-wrap">
        <button class="date-arrow date-arrow-left" id="dateArrowLeft" aria-label="Fechas anteriores">‹</button>
        <div class="date-scroll" id="dateScroll"></div>
        <button class="date-arrow date-arrow-right" id="dateArrowRight" aria-label="Más fechas">›</button>
      </div>
      <span class="section-mini-label">Horario</span>
      <div class="time-groups" id="timeGrid"></div>
      <div class="nav-row">
        <button class="btn btn-back" id="back3"></button>
        <button class="btn btn-next" id="next3" disabled></button>
      </div>
    </div>
  </div>

  <div class="step" data-step="4">
    <div class="step-title" id="step4Title"></div>
    <div class="step-body">
      <div class="step-hint" id="step4Hint"></div>
      <div class="form-field">
        <label for="nombreInput" id="labelNombre"></label>
        <input type="text" id="nombreInput" autocomplete="name">
        <div class="field-error" id="nombreError"></div>
      </div>
      <div class="form-field">
        <label for="telInput" id="labelTelefono"></label>
        <div class="tel-row">
          <select id="prefijoSelect"></select>
          <input type="tel" id="telInput" autocomplete="tel">
        </div>
        <div class="field-error" id="telError"></div>
      </div>
      <div class="form-field">
        <label for="notaInput" id="labelNota"></label>
        <input type="text" id="notaInput">
      </div>
      <div class="nav-row">
        <button class="btn btn-back" id="back4"></button>
        <button class="btn btn-next" id="next4"></button>
      </div>
    </div>
  </div>

  <div class="step" data-step="5">
    <div class="step-title" id="step5Title"></div>
    <div class="step-body">
      <div class="step-hint" id="step5Hint"></div>
      <div class="summary-card" id="summaryCard"></div>
      <div class="nav-row">
        <button class="btn btn-back" id="back5"></button>
        <button class="btn btn-next" id="confirmBtn"></button>
      </div>
    </div>
  </div>

  <div class="step" data-step="6">
    <div class="success-box">
      <div class="success-icon" id="successIcon">✓</div>
      <div class="step-title" style="text-align:center" id="successTitle">¡Reserva exitosa!</div>
      <div class="step-hint" style="text-align:center;max-width:380px;margin-left:auto;margin-right:auto" id="successSub">
        Enviaremos tu confirmación por WhatsApp en unos minutos.
      </div>
      <!-- background:var(--blanco) a propósito, NO var(--card-bg): esta burbuja está anidada
           dentro de .widget, que ahora es naranja -- si usara --card-bg quedaría del mismo
           color que el fondo y se perdería como "burbuja" separada. -->
      <div id="successPoliticas" style="display:none;max-width:380px;margin:18px auto 0;padding:16px 18px;border-radius:14px;background:var(--blanco);border:1px solid rgba(10,15,46,0.08);text-align:left;font-size:14px;line-height:1.6;color:var(--texto-medio);white-space:pre-line"></div>
    </div>
  </div>

</div>

<div style="text-align:center;margin-top:10px">
  <button class="gestionar-link" id="abrirGestionar"></button>
</div>

<div class="airis-footer">
  <div class="airis-footer-row">
    <div class="airis-footer-label" id="footerLabel"></div>
    <div class="airis-footer-logo">airis<span>.</span></div>
  </div>
  <a class="airis-footer-link" href="https://www.airisworld.com" target="_blank">www.airisworld.com</a>
</div>

</div><!-- /#pageScroll -->

</div><!-- /#appShell -->

<!-- Modal "Gestionar mi reserva" -->
<div class="modal-overlay" id="modalGestionar">
  <div class="modal-box">
    <button class="modal-close" id="cerrarGestionar">&times;</button>
    <div class="modal-title" id="modalTitle"></div>
    <div class="modal-hint" id="modalHint"></div>

      <input type="tel" id="modalTelInput" autocomplete="tel">
    </div>
    <button class="modal-btn" id="modalBuscarBtn"></button>
    <div id="modalResultados"></div>
  </div>
</div>

/* Detecta el prefijo telefónico más probable según el idioma/región
   del dispositivo del visitante (ej. 'es-MX' -> México, 'pt-BR' ->
   Brasil, 'en-US' -> Estados Unidos). Si no se puede determinar,
   respalda en Argentina (primer mercado real de Airis) -- nunca
   rompe, siempre devuelve algo usable. */
function detectarPrefijoDefault(){
  const raw = (navigator.language || navigator.userLanguage || '').toUpperCase();
  const partes = raw.split('-');
  const region = partes.length > 1 ? partes[1] : null;
  if(region){
    const match = CONFIG.prefijos.find(p => p.iso === region);
    if(match) return match.code;
  }
  const ar = CONFIG.prefijos.find(p => p.iso === 'AR');
  return ar ? ar.code : CONFIG.prefijos[0].code;
}

/* Trae nombre, prefijo telefónico y marca (logo/colores) del
   restaurante desde Supabase. Si las columnas de marca todavía no
   existen (no corriste el SQL), reintenta pidiendo solo las columnas
   base y usa CONFIG.brandPorDefecto para lo visual. */
async function cargarRestaurante(){
  const sb = window.supabase.createClient(CONFIG.supabase.url, CONFIG.supabase.anonKey);

  const columnasCompletas = 'id, name, phone_prefix, timezone, whatsapp_numero, logo_type, logo_value, color_primario, color_oscuro, color_secundario, color_texto_oscuro, color_texto_medio, color_bg, color_card, bg_image, politicas_confirmacion';
  let { data, error } = await sb.from('restaurants').select(columnasCompletas).eq('slug', CONFIG.supabase.restaurantSlug).single();

  if(error){
    console.warn('[Shiiko Sushi widget] columnas de marca no encontradas todavía (¿corriste el SQL?), sigo solo con datos base:', error.message);
    const basico = await sb.from('restaurants').select('id, name, phone_prefix, timezone, whatsapp_numero').eq('slug', CONFIG.supabase.restaurantSlug).single();
    if(basico.error) throw basico.error;
    data = basico.data;
  }
  return data;
}

function aplicarMarca(restaurante){
  const b = CONFIG.brandPorDefecto;
  const root = document.documentElement.style;
  root.setProperty('--azul', restaurante.color_primario || b.colorPrimario);
  root.setProperty('--navy', restaurante.color_oscuro || b.colorOscuro);
  root.setProperty('--coral', restaurante.color_secundario || b.colorSecundario);
  root.setProperty('--texto-oscuro', restaurante.color_texto_oscuro || b.colorTextoOscuro);
  root.setProperty('--texto-medio', restaurante.color_texto_medio || b.colorTextoMedio);
  root.setProperty('--paper', restaurante.color_bg || b.bgColor);
  root.setProperty('--card-bg', restaurante.color_card || b.cardColor);
  document.body.classList.add('marca-lista');
  // --blanco NO se pisa acá a propósito: es el color de texto/ícono
  // sobre fondos de acento (botones, chips seleccionados) -- tiene
  // que quedar blanco siempre, en cualquier tema, claro u oscuro.

  const bgImage = restaurante.bg_image || b.bgImage;
  if(bgImage){
    document.body.style.backgroundImage = `linear-gradient(rgba(255,255,255,0.55), rgba(255,255,255,0.55)), url('${bgImage}')`;
    document.body.style.backgroundSize = 'cover';
    document.body.style.backgroundPosition = 'center';
    // NO backgroundAttachment:'fixed' a propósito (se sacó 21/08): en
    // varios navegadores mobile (sobre todo los in-app de Instagram/
    // WhatsApp) un fondo con background-attachment:fixed compitiendo
    // con el logo-badge en position:fixed genera conflictos de capas
    // que hacen que el logo se vea "arrastrar" o moverse al hacer
    // scroll, en vez de quedar clavado en su lugar. Sacando esto el
    // logo-badge (que ya es position:fixed, sin tocar) queda estable.
  }

  const logoEl = document.getElementById('logoBadge');
  if(!restaurante.logo_value){
    // Sin logo real cargado todavía -- se oculta el recuadro
    // entero, en vez de mostrar el emoji genérico de relleno.
    logoEl.style.display = 'none';
  }else{
    logoEl.style.display = '';
    const logoType = restaurante.logo_type || b.logoType;
    const logoValue = restaurante.logo_value;
    if(logoType === 'image'){
      logoEl.innerHTML = `<img src="${logoValue}" alt="${restaurante.name}">`;
    }else{
      logoEl.textContent = logoValue;
    }
  }
}

function renderProgress(){
  const bar = document.getElementById('progressBar');
  bar.innerHTML = '';
  for(let i=1;i<=totalSteps;i++){
    const seg = document.createElement('div');
    seg.className = 'progress-seg' + (i < state.step ? ' done' : i === state.step ? ' active' : '');

    fill.className = 'progress-seg-fill';
    seg.appendChild(fill);
    bar.appendChild(seg);
  }
  document.getElementById('progressStepLabel').textContent = T.progressStep(Math.min(state.step,totalSteps), totalSteps);

      <div class="salon-icon">${s.icon}</div>
      <div class="salon-info"><h4>${s.nombre}</h4><p>${s.desc}</p></div>
      <div class="salon-check"></div>
    `;
    card.addEventListener('click', () => {
      state.salon = s.id;
      state.personasMax = s.maxPersonasPorReserva;
      if(state.personas > state.personasMax) state.personas = state.personasMax;
      renderSalones();
      document.getElementById('next1').disabled = false;
    });
    grid.appendChild(card);
  });
}

function renderPersonas(){
  document.getElementById('personasNum').textContent = state.personas;
  document.getElementById('personasMinus').disabled = state.personas <= CONFIG.personasMin;
  document.getElementById('personasPlus').disabled = state.personas >= (state.personasMax || CONFIG.personasMaxPorDefecto);
  const tope = state.personasMax || CONFIG.personasMaxPorDefecto;
  const quick = document.getElementById('personasQuick');
  quick.innerHTML = '';
  CONFIG.personasQuickPicks.filter(n => n <= tope).forEach(n => {
    const chip = document.createElement('div');
    chip.className = 'quick-chip' + (state.personas === n ? ' selected' : '');
    chip.textContent = `${n} personas`;
    chip.addEventListener('click', () => { state.personas = n; ocultarCartelGrupo(); renderPersonas(); });
    quick.appendChild(chip);
  });

  // Chip fijo, siempre visible junto a los demás -- no depende de llegar
  // al tope con el stepper. Estilo distinto (coral) para diferenciarlo
  // como "esto no es un número más, es otra cosa".
  const chipGrupo = document.createElement('div');
  chipGrupo.className = 'quick-chip';
  chipGrupo.style.borderColor = 'var(--coral)';
  chipGrupo.style.color = 'var(--coral)';
  chipGrupo.textContent = T.grupoGrandeChip;
  chipGrupo.addEventListener('click', () => mostrarCartelGrupo());
  quick.appendChild(chipGrupo);
}

/* Muestra el cartel de derivación a WhatsApp para grupos grandes --
   independiente del valor de state.personas, se puede activar desde
   el chip fijo (siempre visible) o automáticamente al llegar al tope
   con el stepper +/-. */
function mostrarCartelGrupo(){
  const grupoBox = document.getElementById('grupoGrandeBox');
  const tope = state.personasMax || CONFIG.personasMaxPorDefecto;
  grupoBox.style.display = 'block';
  // Fijo en 10, no tope+1: es una regla de negocio del restaurante
  // ("a partir de 10 personas se considera evento/grupo grande a
  // coordinar"), independiente del tope de reserva online (8).
  document.getElementById('grupoGrandeTexto').textContent = T.grupoGrandeText(10);
  document.getElementById('grupoGrandeBtn').textContent = T.grupoGrandeBtn;
  document.getElementById('grupoGrandeBtn').onclick = (e) => {
    e.preventDefault();
    derivarGrupoGrande();
  };
  grupoBox.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}
function ocultarCartelGrupo(){
  document.getElementById('grupoGrandeBox').style.display = 'none';
}
document.getElementById('personasMinus').addEventListener('click', () => {
  if(state.personas > CONFIG.personasMin){ state.personas--; ocultarCartelGrupo(); renderPersonas(); }
});
document.getElementById('personasPlus').addEventListener('click', () => {
  if(state.personas < (state.personasMax || CONFIG.personasMaxPorDefecto)){ state.personas++; renderPersonas(); }
  else { mostrarCartelGrupo(); }
});

/* Deriva un pedido de grupo grande: abre WhatsApp con el mensaje
   pre-cargado (en el idioma detectado, para que el cliente no espere
   nada) y, en paralelo, avisa al Endpoint 3 para que quede registrado
   en Contacto/derivaciones, sin bloquear la apertura de WhatsApp si
   ese llamado tarda o falla. */
function derivarGrupoGrande(){
  const salon = CONFIG.salones.find(s => s.id === state.salon);
  // Un solo salón -- el mensaje ya no menciona el nombre del espacio.
  const texto = T.whatsappMensaje();
  // Nunca caer en un número de respaldo de otro cliente -- si el
  // número real de este restaurante no cargó, es mejor avisar el
  // error que mandar el mensaje al WhatsApp equivocado.
  const numeroWhatsapp = restaurantData?.whatsapp_numero;
  if(!numeroWhatsapp){
    console.error('[Shiiko Sushi widget] whatsapp_numero no disponible para este restaurante -- no se abre WhatsApp para evitar mandar a un número equivocado');
    alert(T.errorWhatsapp || 'No pudimos abrir WhatsApp en este momento. Por favor, intentá de nuevo en unos segundos.');
    return;
  }
  const url = `https://wa.me/${numeroWhatsapp}?text=${encodeURIComponent(texto)}`;
  window.open(url, '_blank');

  if(!CONFIG.MOCK_MODE && salon){
    fetch(CONFIG.webhookGrupoGrande, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        restaurant_id: restaurantData.id,
        room_slug: salon.id,
        nombre: 'Consulta desde la página',
        telefono: '',
        personas: state.personas,
      }),
    }).catch(e => console.warn('[Shiiko Sushi widget] no se pudo registrar la derivación (no bloqueante):', e));
  }
}

const DOW = ['DOM','LUN','MAR','MIE','JUE','VIE','SAB'];
const MON = ['ENE','FEB','MAR','ABR','MAY','JUN','JUL','AGO','SEP','OCT','NOV','DIC'];

function renderFechas(){
  const scroll = document.getElementById('dateScroll');
  scroll.innerHTML = '';
  const today = new Date();
  // Días cerrados del salón elegido -- 100% dinámico, viene de
  // rooms.closed_days de Supabase, nunca hardcodeado. Cada restaurante
  // (y cada salón dentro de un mismo restaurante) puede tener sus
  // propios días de cierre semanal.
  const salonActual = CONFIG.salones.find(s => s.id === state.salon);
  const closedDays = salonActual?.closedDays || [];

  const resumenTexto = document.getElementById('salonResumenTexto');
  if(resumenTexto) resumenTexto.textContent = salonActual ? `${salonActual.icon} ${salonActual.nombre}` : '';

  if(state.salon){
    console.log('[Shiiko Sushi widget] DIAGNÓSTICO -- salón elegido:', state.salon,
      '| días cerrados de este salón:', closedDays,
      '| excepciones cargadas para este salón:', EXCEPCIONES_APERTURA[state.salon] ? [...EXCEPCIONES_APERTURA[state.salon]] : 'ninguna');
  }

  for(let i=0;i<CONFIG.diasDisponibles;i++){
    const d = new Date(today);
    d.setDate(today.getDate()+i);
    const yyyy = d.getFullYear();
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const dd = String(d.getDate()).padStart(2, '0');
    const iso = `${yyyy}-${mm}-${dd}`;
    const esCerradoNormal = closedDays.includes(d.getDay());
    // Si hoy está normalmente cerrado, pero hay un aviso real y activo
    // de Apertura Especial para esta fecha puntual en este salón, la
    // excepción gana -- el día se muestra abierto igual.
    const tieneExcepcion = EXCEPCIONES_APERTURA[state.salon]?.has(iso) || false;
    const esCerrado = esCerradoNormal && !tieneExcepcion;
    const chip = document.createElement('div');
    chip.className = 'date-chip'
      + (state.fechaISO === iso ? ' selected' : '')
      + (esCerrado ? ' closed' : '');
    chip.innerHTML = `
      <div class="date-dow">${DOW[d.getDay()]}</div>
      <div class="date-num">${d.getDate()}</div>
      <div class="date-mon">${MON[d.getMonth()]}</div>
    `;
    chip.dataset.iso = iso;
    if(!esCerrado){
      chip.addEventListener('click', () => seleccionarFecha(iso, d));
    }
    scroll.appendChild(chip);
  }

  // Si ya había una fecha elegida de una vuelta anterior (ej: el cliente
  // volvió a cambiar de salón con "Cambiar espacio" y ahora regresa acá),
  // el chip queda marcado como seleccionado arriba, pero el grid de
  // horarios todavía tiene los datos del salón anterior -- nunca se
  // vuelve a pedir solo por reconstruir los chips. Dos casos:
  const chipPrevio = state.fechaISO ? scroll.querySelector(`.date-chip[data-iso="${state.fechaISO}"]`) : null;
  if(chipPrevio && !chipPrevio.classList.contains('closed')){
    // La fecha sigue siendo válida para el salón actual -> refrescamos
    // los horarios reales para esa combinación salón+fecha nueva.
    cargarHorarios();
  } else if(state.fechaISO){
    // La fecha ya no es válida para el nuevo salón (día cerrado sin
    // excepción) -> se limpia la selección para no dejar arrastrado
    // un horario que ya no corresponde.
    state.fechaISO = null; state.fechaLabel = null; state.hora = null; state.horaISO = null;
    document.getElementById('timeGrid').innerHTML = '';
    document.getElementById('next3').disabled = true;
  }
}

/* Selecciona una fecha SIN reconstruir todo el selector -- solo mueve
   la clase "selected" al chip correspondiente. Reconstruir todo el DOM
   (como hacía antes) resetea el scroll horizontal a la posición
   inicial en cualquier navegador -- por eso, al elegir una fecha
   lejana (scrolleando con las flechas), la pantalla "saltaba" de
   vuelta al principio, dando la sensación de que el click no
   funcionaba. Confirmado como causa real, corregido acá. */
function seleccionarFecha(iso, d){
  state.fechaISO = iso;
  state.fechaLabel = `${d.getDate()} de ${MON[d.getMonth()].charAt(0)+MON[d.getMonth()].slice(1).toLowerCase()}`;
  state.hora = null;
  document.querySelectorAll('.date-chip').forEach(el => el.classList.remove('selected'));
  const chipEl = document.querySelector(`.date-chip[data-iso="${iso}"]`);
  if(chipEl) chipEl.classList.add('selected');
  cargarHorarios();
}

/* Las flechas desplazan el selector una "pantalla" por click. No se
   deshabilitan automáticamente en los extremos -- ese cálculo dependía
   de medir el ancho del selector, que puede estar oculto (display:none,
   antes de llegar al paso 3) y medir 0, dejando la flecha bloqueada
   por error incluso habiendo más fechas para mostrar. Más simple y
   más confiable: siempre activas, sin efecto si ya no hay más para
   ese lado. */
document.getElementById('dateArrowLeft').addEventListener('click', () => {
  const scroll = document.getElementById('dateScroll');
  scroll.scrollBy({ left: -scroll.clientWidth * 0.8, behavior: 'smooth' });
});
document.getElementById('dateArrowRight').addEventListener('click', () => {
  const scroll = document.getElementById('dateScroll');
  scroll.scrollBy({ left: scroll.clientWidth * 0.8, behavior: 'smooth' });
});

/* Consulta el Endpoint 1 real (disponibilidad-real). En modo de prueba
   devuelve horarios de ejemplo. Devuelve un array de {iso, label} -- ya
   no strings sueltos, porque ahora necesitamos el ISO exacto para poder
   crear la reserva real después, sin volver a calcular nada. */
async function obtenerHorarios(roomSlug, fechaISO){
  if(CONFIG.MOCK_MODE){
    await new Promise(r => setTimeout(r, 500));
    return MOCK_HORARIOS.map(h => ({ iso: `${fechaISO}T${h}:00-03:00`, label: h }));
  }
  try{
    const res = await fetch(CONFIG.webhookHorarios, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        restaurant_id: restaurantData.id,
        room_slug: roomSlug,
        fecha: fechaISO,
        personas: state.personas,
      }),
    });
    const data = await res.json();
    return (data.horarios || []).map(h => ({ iso: h.horario_iso, label: h.horario_label }));
  }catch(e){
    console.error('[Shiiko Sushi widget] error consultando horarios', e);
    return [];
  }
}

async function cargarHorarios(){
  const grid = document.getElementById('timeGrid');
  grid.innerHTML = `<div class="time-loading">${T.horariosLoading}</div>`;
  document.getElementById('next3').disabled = true;

  const salon = CONFIG.salones.find(s => s.id === state.salon);
  const horarios = await obtenerHorarios(salon.id, state.fechaISO);

  grid.innerHTML = '';
  if(horarios.length === 0){
    grid.innerHTML = `<div class="time-empty">${T.horariosEmpty}</div>`;
    return;
  }

  // Agrupa por franja del día (mañana/tarde/noche) leyendo la hora
  // directo del ISO -- así, si un restaurante tiene un solo turno
  // (ej. solo de noche), nunca aparece un título de franja vacío o
  // sobrando; el título solo se muestra cuando de verdad hace falta
  // separar 2 o más franjas con horarios reales.
  const franjas = [
    { id: 'manana', label: T.franjaManana, desde: 0, hasta: 12 },
    { id: 'tarde',  label: T.franjaTarde,  desde: 12, hasta: 19 },
    { id: 'noche',  label: T.franjaNoche,  desde: 19, hasta: 24 },
  ];
  const grupos = franjas.map(f => ({
    ...f,
    items: horarios.filter(h => {
      const hora = parseInt(h.iso.slice(11, 13), 10);
      return hora >= f.desde && hora < f.hasta;
    })
  })).filter(g => g.items.length > 0);

  const mostrarTitulos = grupos.length > 1;

  grupos.forEach(g => {
    if(mostrarTitulos){
      const titulo = document.createElement('div');
      titulo.className = 'time-franja-label';
      titulo.textContent = g.label;
      grid.appendChild(titulo);
    }
    const fila = document.createElement('div');
    fila.className = 'time-grid';
    g.items.forEach(h => {
      const slot = document.createElement('div');
      slot.className = 'time-slot' + (state.horaISO === h.iso ? ' selected' : '');
      slot.textContent = h.label;
      slot.addEventListener('click', () => {
        state.hora = h.label;
        state.horaISO = h.iso;
        cargarHorarios();
        document.getElementById('next3').disabled = false;
      });
      fila.appendChild(slot);
    });
    grid.appendChild(fila);
  });
}

function validarDatos(){
  const nombre = document.getElementById('nombreInput').value.trim();
  const tel = document.getElementById('telInput').value.trim();
  const telDigits = tel.replace(/\D/g,'');

  const nombreOk = nombre.length > 3 && nombre.includes(' ');
  document.getElementById('nombreError').classList.toggle('show', !nombreOk);

  const telOk = telDigits.length >= 6;
  document.getElementById('telError').classList.toggle('show', !telOk);

  state.nota = document.getElementById('notaInput').value.trim();

  if(nombreOk && telOk){
    state.nombre = nombre;
    state.telefono = telDigits;
    return true;
  }
  return false;
}

/* Crea la reserva real vía el Endpoint 2 (confirmar-reserva). En modo
   de prueba solo simula el envío. */
async function crearReserva(){
  const salon = CONFIG.salones.find(s => s.id === state.salon);
  const payload = {
    restaurant_id: restaurantData.id,
    room_slug: salon.id,
    horario_iso: state.horaISO,
    personas: state.personas,
    nombre: state.nombre,
    telefono: `${state.prefijo}${state.telefono}`,
    notas: state.nota,
  };

  if(CONFIG.MOCK_MODE){
    await new Promise(r => setTimeout(r, 600));
    console.log('[Shiiko Sushi widget] MOCK — se hubiera creado esta reserva:', payload);
    return { success: true };
  }

  try{
    const res = await fetch(CONFIG.webhookReserva, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload),
    });
    return await res.json();
  }catch(e){
    console.error('[Shiiko Sushi widget] error creando la reserva', e);
    return { success: false };
  }
}

const DIAS_SEMANA = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];

function closedDaysToTexto(closedDays){
  if(!closedDays || closedDays.length === 0) return null;
  const nombres = closedDays.map(d => DIAS_SEMANA[d]);
  return 'Cerrado ' + nombres.join(' y ');
}

/* Trae los salones activos de este restaurante directo de Supabase
   (tabla rooms, filtrando por el slug del restaurante). Si algo falla
   (RLS, red, etc.) usa CONFIG.salonesRespaldo para que la página
   nunca quede rota. */
async function cargarSalones(){
  const sb = window.supabase.createClient(CONFIG.supabase.url, CONFIG.supabase.anonKey);
  const { data, error } = await sb
    .from('rooms')
    .select('slug, name, emoji, ghl_calendar_id, descripcion_fisica, closed_days, max_people, max_personas_por_reserva, restaurants!inner(slug)')
    .eq('restaurants.slug', CONFIG.supabase.restaurantSlug)
    .eq('active', true)
    .order('sort_order');

  if(error) throw error;
  if(!data || data.length === 0) throw new Error('No hay salones activos cargados para este restaurante en Supabase.');

  return data.map(row => ({
    id: row.slug,
    nombre: row.name,
    icon: row.emoji || '🍽️',
    calendarId: row.ghl_calendar_id,
    desc: row.descripcion_fisica || '',
    nota: closedDaysToTexto(row.closed_days),
    closedDays: row.closed_days || [],
    maxPeople: row.max_people || CONFIG.personasMaxPorDefecto,
    maxPersonasPorReserva: row.max_personas_por_reserva || 8,
  }));
}

/* Trae los avisos activos de "Apertura Especial" del restaurante, y
   arma un Set con las fechas (YYYY-MM-DD) que cada salón tiene abiertas
   por excepción -- para no bloquear en el selector un día que
   normalmente está cerrado (rooms.closed_days) pero que un aviso real
   activo abrió puntualmente. Se guarda en EXCEPCIONES_APERTURA, un
   objeto { room_slug: Set(fechas) }, calculado una sola vez al cargar. */
let EXCEPCIONES_APERTURA = {};
async function cargarExcepcionesAperturaEspecial(){
  try{
    const sb = window.supabase.createClient(CONFIG.supabase.url, CONFIG.supabase.anonKey);
    const { data, error } = await sb.from('airis_avisos')
      .select('fecha_desde, datos')
      .eq('restaurant_id', restaurantData.id)
      .eq('categoria', 'apertura_especial')
      .eq('activo', true);
    if(error) throw error;

    const mapa = {};
    (data || []).forEach(aviso => {
      const rooms = aviso.datos?.rooms || [];
      // Normalizamos a los primeros 10 caracteres (YYYY-MM-DD) --
      // Supabase puede devolver fecha_desde como fecha pura o con hora
      // y zona horaria incluida según el tipo real de la columna, y una
      // comparación exacta de texto fallaba en silencio si no coincidía
      // carácter por carácter. Esto funciona sea cual sea el formato real.
      const fechaNormalizada = String(aviso.fecha_desde).slice(0, 10);
      rooms.forEach(r => {
        if(!mapa[r.room_slug]) mapa[r.room_slug] = new Set();
        mapa[r.room_slug].add(fechaNormalizada);
      });
    });
    EXCEPCIONES_APERTURA = mapa;
    console.log('[Shiiko Sushi widget] excepciones de apertura especial cargadas:', EXCEPCIONES_APERTURA);
  }catch(e){
    console.warn('[Shiiko Sushi widget] no se pudieron cargar las excepciones de apertura especial (no bloqueante):', e);
    EXCEPCIONES_APERTURA = {};
  }
}

/* 📌 LOGO SIEMPRE FIJO -- ver el bloque de comentarios largo en el CSS,
   junto a "html,body{overflow:hidden}" y ".page-scroll". Ya no hace
   falta nada acá en JS: el documento (html/body) no scrollea nunca,
   todo el contenido vive adentro de #pageScroll (que sí scrollea), y
   el logo es un hermano de #pageScroll con position:absolute respecto
   de body -- por pura geometría, sin JS ni trucos, nunca se mueve. */

async function init(){
  aplicarIdioma();
  try{
    restaurantData = await cargarRestaurante();
    document.title = `${T.pageTitle} — ${restaurantData.name}`;
    document.getElementById('topEyebrow').textContent = restaurantData.name;
    aplicarMarca(restaurantData);
    if(restaurantData.phone_prefix){
      const yaExiste = CONFIG.prefijos.find(p => p.code === restaurantData.phone_prefix);
      if(yaExiste) state.prefijo = restaurantData.phone_prefix;
    }

    CONFIG.salones = await cargarSalones();
    await cargarExcepcionesAperturaEspecial();
    if(!CONFIG.MOCK_MODE) document.getElementById('mockBanner').classList.add('hidden');

    renderSalones();
    renderPersonas();
    renderFechas();
    renderPrefijos();
    renderProgress();
  }catch(e){
    console.error('[Shiiko Sushi widget] error cargando datos de Supabase:', e);
    document.body.classList.add('marca-lista');
    mostrarErrorCarga(T.errorCarga);
  }
}
/* ============================================================
   Modal "Gestionar mi reserva" -- búsqueda por teléfono y
   cancelación. Independiente del flujo de 6 pasos de arriba,
   se puede abrir en cualquier momento desde el link del footer.
   ============================================================ */
function renderPrefijosModal(){
  const sel = document.getElementById('modalPrefijoSelect');
  sel.innerHTML = '';
  CONFIG.prefijos.forEach(p => {
    const opt = document.createElement('option');
    opt.value = p.code;
    opt.textContent = p.label;
    sel.appendChild(opt);
  });
  sel.value = state.prefijo;
}

function abrirModalGestionar(){
  document.getElementById('modalGestionar').classList.add('open');
  document.getElementById('modalResultados').innerHTML = '';
  document.getElementById('modalTelInput').value = '';
  renderPrefijosModal();
}
function cerrarModalGestionar(){
  document.getElementById('modalGestionar').classList.remove('open');
}
document.getElementById('abrirGestionar').addEventListener('click', abrirModalGestionar);
document.getElementById('cerrarGestionar').addEventListener('click', cerrarModalGestionar);
document.getElementById('modalGestionar').addEventListener('click', (e) => {
  if(e.target.id === 'modalGestionar') cerrarModalGestionar();
});

async function buscarMisReservas(){
  const prefijo = document.getElementById('modalPrefijoSelect').value;
  const telDigits = document.getElementById('modalTelInput').value.trim().replace(/\D/g,'');
  const telefono = `${prefijo}${telDigits}`;
  const btn = document.getElementById('modalBuscarBtn');
  const resultados = document.getElementById('modalResultados');

  btn.disabled = true;
  btn.textContent = T.modalBuscando;
  resultados.innerHTML = '';

  try{
    const res = await fetch(CONFIG.webhookBuscarReservas, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ restaurant_id: restaurantData.id, telefono }),
    });
    const data = await res.json();
    renderReservasEncontradas(data.reservas || []);
  }catch(e){
    console.error('[Shiiko Sushi widget] error buscando reservas', e);
    renderReservasEncontradas([]);
  }

  btn.disabled = false;
  btn.textContent = T.modalBuscarBtn;
}
document.getElementById('modalBuscarBtn').addEventListener('click', buscarMisReservas);

function renderReservasEncontradas(reservas){
  const cont = document.getElementById('modalResultados');
  cont.innerHTML = '';

  if(reservas.length === 0){
    cont.innerHTML = `<div class="modal-empty">${T.modalEmpty}</div>`;
    return;
  }

  reservas.forEach(r => {
    const fecha = new Date(r.reserved_at);
    const fechaLabel = fecha.toLocaleString(LANG, { timeZone: restaurantData?.timezone || 'America/Argentina/Buenos_Aires', day: 'numeric', month: 'long', hour: '2-digit', minute: '2-digit' });
    const item = document.createElement('div');
    item.className = 'reserva-item';
    item.innerHTML = `
      <div class="reserva-item-row"><span class="reserva-item-label">${T.summaryEspacio}</span><span class="reserva-item-val">${r.room_name}</span></div>
      <div class="reserva-item-row"><span class="reserva-item-label">${T.summaryFecha}</span><span class="reserva-item-val">${fechaLabel}</span></div>
      <div class="reserva-item-row"><span class="reserva-item-label">${T.summaryPersonas}</span><span class="reserva-item-val">${r.people_count} ${T.modalReservaPersonas}</span></div>
      <button class="reserva-cancel-btn" data-id="${r.id}">${T.modalCancelarBtn}</button>
    `;
    item.querySelector('.reserva-cancel-btn').addEventListener('click', (e) => cancelarReserva(r.id, e.target));
    cont.appendChild(item);
  });
}

async function cancelarReserva(reservationId, btn){
  if(!confirm(T.modalConfirmarCancelar)) return;

  btn.disabled = true;
  btn.textContent = T.modalCancelando;

  try{
    const res = await fetch(CONFIG.webhookCancelarReserva, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ reservation_id: reservationId }),
    });
    const data = await res.json();
    const cont = document.getElementById('modalResultados');
    if(data.success){
      cont.innerHTML = `<div class="modal-msg ok">${T.modalCanceladaOk}</div>`;
    }else{
      cont.innerHTML = `<div class="modal-msg err">${T.modalCanceladaErr}</div>`;
    }
  }catch(e){
    console.error('[Shiiko Sushi widget] error cancelando reserva', e);
    document.getElementById('modalResultados').innerHTML = `<div class="modal-msg err">${T.modalCanceladaErr}</div>`;
  }
}

init();
</script>
</body>
</html>
